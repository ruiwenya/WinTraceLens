<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTraceLens - 事件日志分析</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #182235;
      --muted: #5b6678;
      --head: #243447;
      --head-2: #edf3f8;
      --accent: #1769aa;
      --accent-dark: #0f4e82;
      --bad: #a41220;
      --warn: #9a5200;
      --ok: #176b43;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 18px;
      background: var(--head);
      color: #fff;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr);
      gap: 10px;
      height: calc(100vh - 48px);
      padding: 12px;
    }
    .toolbar, .summary, .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, select {
      width: min(560px, 100%);
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    input.date-input {
      width: 148px;
      min-width: 148px;
      flex: 0 0 148px;
    }
    .range-label {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    select.limit-select {
      width: 106px;
      min-width: 106px;
      flex: 0 0 106px;
    }
    button, a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent-dark);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }
    button.secondary, a.button.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab.active {
      border-color: var(--accent);
      background: #e8f2fb;
      color: var(--accent-dark);
    }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    .status {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
    }
    .summary {
      min-height: 34px;
      color: var(--muted);
    }
    .count {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
    }
    .count.bad { border-color: #edb4bd; background: #fff0f2; color: var(--bad); }
    .count.warn { border-color: #f0ce9f; background: #fff7e8; color: var(--warn); }
    .count.ok { border-color: #b8d7c8; background: #edf8f2; color: var(--ok); }
    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }
    .table-wrap {
      height: 100%;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head-2);
      color: #26384f;
      font-weight: 650;
    }
    button.sort-head {
      width: 100%;
      height: 24px;
      justify-content: flex-start;
      gap: 6px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #26384f;
      font-weight: 650;
      text-align: left;
    }
    button.sort-head:hover {
      color: var(--accent-dark);
    }
    .sort-indicator {
      min-width: 12px;
      color: var(--accent);
      font-size: 11px;
    }
    tbody tr:hover td { background: #f3f8ff; }
    .time { width: 160px; }
    .category { width: 120px; }
    .source { width: 190px; }
    .event { width: 82px; }
    .action { width: 135px; }
    .account { width: 180px; }
    .short { width: 120px; }
    .logon { width: 170px; }
    .ip { width: 150px; }
    .workstation { width: 170px; }
    .process { width: 260px; }
    .service { width: 220px; }
    .command { width: 360px; }
    .status-code { width: 120px; }
    .reason { width: 240px; }
    .sid { width: 260px; }
    .provider { width: 230px; }
    .message { width: 520px; }
    .details { width: 320px; }
    .empty { padding: 18px; color: var(--muted); }
    .bad-text { color: var(--bad); }
    .view-context {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.4fr);
      gap: 14px;
      padding: 11px 13px;
      border: 1px solid #cbd8e6;
      border-left: 4px solid var(--accent);
      border-radius: 5px;
      background: #f7faff;
    }
    .context-title {
      margin: 0 0 4px;
      color: #213850;
      font-size: 15px;
      font-weight: 700;
    }
    .context-text, .context-reminders {
      color: var(--muted);
      line-height: 1.5;
    }
    .context-reminders {
      display: grid;
      gap: 3px;
    }
    .context-reminders span::before {
      content: "•";
      margin-right: 7px;
      color: var(--accent);
    }
    .collection-note {
      color: var(--warn);
    }
    table.view-all { min-width: 1500px; }
    table.view-logon { min-width: 2140px; }
    table.view-rdp { min-width: 1640px; }
    table.view-service { min-width: 1650px; }
    table.view-user { min-width: 1700px; }
    table.view-powershell { min-width: 1750px; }
    table.view-sql { min-width: 1550px; }
    td.wrap-cell {
      white-space: normal;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }
    .target { width: 220px; }
    .note { width: 300px; }
    .risk { width: 90px; }
    .risk-badge {
      display: inline-flex;
      align-items: center;
      height: 23px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 12px;
      white-space: nowrap;
    }
    .risk-badge.high { border-color: #edb4bd; background: #fff0f2; color: var(--bad); }
    .risk-badge.medium { border-color: #f0ce9f; background: #fff7e8; color: var(--warn); }
    .risk-badge.info { border-color: #c7d7ee; background: #eef5fd; color: var(--accent-dark); }
    tr.risk-high td { background: #fffafb; }
    tr.risk-medium td { background: #fffdf8; }
    button.row-detail {
      height: 28px;
      padding: 0 9px;
      border-color: var(--line);
      background: #fff;
      color: var(--accent-dark);
    }
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(18, 29, 43, 0.56);
    }
    .detail-overlay[hidden] { display: none; }
    .detail-dialog {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(980px, 96vw);
      max-height: 88vh;
      overflow: hidden;
      border: 1px solid #8194aa;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(16, 31, 48, 0.28);
    }
    .detail-dialog h2 {
      margin: 0;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
    }
    .detail-content {
      overflow: auto;
      padding: 12px 16px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      border-top: 1px solid var(--line-soft);
    }
    .detail-grid > div {
      padding: 8px;
      border-bottom: 1px solid var(--line-soft);
      line-height: 1.48;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .detail-grid > div:nth-child(odd) {
      background: #f7f9fc;
      color: #405168;
      font-weight: 650;
    }
    .detail-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
    }
    @media (max-width: 900px) {
      .view-context { grid-template-columns: 1fr; }
    }
  </style>

<body>
  <header>
    <h1>WinTraceLens</h1>
    <div class="app-meta">
      <span class="release-badge" data-app-version>1.0 基础版</span>
      <span class="permission-badge unknown" data-admin-status>权限检测中</span>
      <span class="module-title">Windows 事件日志分析</span>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <nav class="top-nav" aria-label="主要功能">
        <a class="nav-link" href="/">进程信息</a>
        <a class="nav-link" href="/host.html">主机信息</a>
        <a class="nav-link" href="/findings.html">风险线索</a>
        <a class="nav-link" href="/threat.html">威胁分析</a>
        <a class="nav-link" href="/investigation.html">案件调查</a>
        <a class="nav-link" href="/filetrace.html">文件痕迹</a>

  <div id="detail-overlay" class="detail-overlay" hidden>

  <script>
    const table = document.getElementById('table');
    const filter = document.getElementById('filter');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const exportCSV = document.getElementById('export-csv');
    const startDate = document.getElementById('start-date');
    const endDate = document.getElementById('end-date');
    const maxRecords = document.getElementById('max-records');
    const viewContextEl = document.getElementById('view-context');
    const detailOverlayEl = document.getElementById('detail-overlay');
    const detailContentEl = document.getElementById('detail-content');
    const detailTitleEl = document.getElementById('detail-dialog-title');
    const detailCopyEl = document.getElementById('detail-copy');
    const detailCloseEl = document.getElementById('detail-close');
    let events = [];
    let collectionErrors = [];
    let activeTab = 'all';
    let detailRawText = '';
    let failureCounts = new Map();
    let sortByTab = {};
    let healthSources = [];
    let healthSummary = {};
    let healthGeneratedAt = '';
    const requestedTab = new URLSearchParams(location.search).get('tab');
    if (document.querySelector(`button.tab[data-tab="${requestedTab}"]`)) activeTab = requestedTab;

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeCell(value) {
      return text(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function visibleItems() {
      const tabItems = events.filter(item => tabMatches(item));
      const q = filter.value.trim();
      if (!q) return tabItems;
      return tabItems.filter(item => window.wtlMatchesQuery(q, Object.values(item)));
    }

    function tabMatches(item, tab = activeTab) {
      if (tab === 'all') return !isLowValuePowerShell(item);
      if (tab === 'logon') {
        return ['登录', '登录失败', '注销', '特权登录', '工作站锁定', '工作站解锁'].includes(item.category);
      }
      if (tab === 'rdp') return text(item.category).includes('RDP') || text(item.action).includes('RDP');
      if (tab === 'service') return item.category === '服务创建';
      if (tab === 'user') return item.category === '用户账户';
      if (tab === 'powershell') return item.category === 'PowerShell日志';
      if (tab === 'sql') return item.category === 'SQL Server日志';
      return true;
    }

    function isLowValuePowerShell(item) {
      if (item.category !== 'PowerShell日志') return false;
      const content = item.command || item.message || item.details || '';
      return ['400', '403', '600', '4103', '4105', '4106'].includes(text(item.eventId)) && !suspiciousPowerShell(content);
    }

    function tabCount(tab) {
      if (tab === 'health') return healthSources.length;
      return events.filter(item => tabMatches(item, tab)).length;
    }

    function updateTabs() {
      document.querySelectorAll('button.tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
        btn.textContent = `${btn.dataset.label} ${tabCount(btn.dataset.tab)}`;
      });
    }

    function identity(item) {
      const account = text(item.account);
      const domain = text(item.domain);
      if (domain && account) return `${domain}\\${account}`;
      return account || domain || '-';
    }

    function eventRef(item) {
      return `${item.eventId || '-'} · ${item.source || item.provider || '-'}`;
    }

    function sourceEndpoint(item) {
      const endpoint = [item.sourceIp, item.sourcePort].filter(Boolean).join(':');
      return endpoint || item.workstation || item.process || '-';
    }

    function commandOrMessage(item) {
      return item.command || item.message || item.details || '-';
    }

    function compact(value, max = 360) {
      const content = text(value).replace(/\s+/g, ' ').trim();
      return content.length > max ? `${content.slice(0, max)}...` : (content || '-');
    }

    function suspiciousServicePath(value) {
      return /\\(temp|appdata|programdata|users|recycler|\$recycle\.bin)\\/i.test(text(value)) ||
        /\.(ps1|vbs|js|bat|cmd)\b/i.test(text(value));
    }

    function suspiciousPowerShell(value) {
      return /(encodedcommand|frombase64string|downloadstring|downloadfile|invoke-webrequest|invoke-restmethod|\biex\b|invoke-expression|reflection\.assembly|executionpolicy\s+bypass|windowstyle\s+hidden|http[s]?:\/\/)/i.test(text(value));
    }

    function isWinTraceLensCollector(value) {
      const content = text(value).toLowerCase();
      if (content.includes('wtl-collector') || content.includes('wtlcollectormarker')) return true;
      return [
        ['function new-eventfilter', 'convert-securityaction'],
        ['$customrootsjson', 'function add-artifactrecord'],
        ['function suspicion-forfile', 'function add-filelist'],
        ['function data-summary', 'function join-endpoint'],
        ['function get-wmicompat', 'win32_service'],
        ['function walk-folder', 'schedule.service'],
        ['function add-driverevent', 'system/7045'],
        ['function test-eventsource', 'windows filtering platform'],
        ['win32_perfformatteddata_perfproc_process', 'parentprocessid,commandline,workingsetsize'],
        ['get-ciminstance win32_process', 'processid,parentprocessid | convertto-json']
      ].some(pair => content.includes(pair[0]) && content.includes(pair[1]));
    }

    function buildReviewContext(items) {
      failureCounts = new Map();
      items.filter(item => text(item.eventId) === '4625').forEach(item => {
        const key = `${item.sourceIp || '-'}|${identity(item)}`;
        failureCounts.set(key, (failureCounts.get(key) || 0) + 1);
      });
    }

    function sameFailureCount(item) {
      if (text(item.eventId) !== '4625') return 0;
      const key = `${item.sourceIp || '-'}|${identity(item)}`;
      return failureCounts.get(key) || 0;
    }

    function reviewFor(item, scopeItems) {
      const eventId = text(item.eventId);
      const action = text(item.action);
      const combined = `${item.command || ''} ${item.message || ''} ${item.details || ''}`;
      const primaryCommand = item.command || item.message || item.details || '';
      const result = { level: 'info', label: '信息', note: '结合时间、账户和相邻事件判断，单条日志不能直接定性。' };

      if (eventId === '4625' || action.includes('登录失败')) {
        const failures = sameFailureCount(item);
        result.level = failures >= 5 ? 'high' : 'medium';
        result.label = failures >= 5 ? '高关注' : '需核查';
        result.note = failures >= 5
          ? `同一来源与账户组合出现 ${failures} 次失败，检查口令喷洒、暴力破解或横向移动。`
          : '核对失败原因、来源 IP 与账户；单次失败也可能是密码输错或保存的旧凭据。';
      } else if (eventId === '4672') {
        result.level = 'medium';
        result.label = '需核查';
        result.note = '特权令牌分配事件，管理员和系统服务也会产生；关注非常用账户及异常时段。';
      } else if (text(item.logonType) === '10') {
        result.level = 'medium';
        result.label = '需核查';
        result.note = 'LogonType 10 表示远程交互式登录，核对来源 IP、账户和 RDP 会话事件。';
      } else if (text(item.logonType) === '3') {
        result.note = 'LogonType 3 是网络登录，常见于 SMB、共享、服务访问和内网横向连接。';
      }

      if (eventId === '1149') {
        result.note = '1149 表示 RDP 网络级身份验证成功，不等同于已经建立桌面会话；继续查找 21/22/4624。';
      } else if (['21', '22'].includes(eventId)) {
        result.level = 'medium';
        result.label = '需核查';
        result.note = 'RDP 会话已登录或 Shell 已启动，应核对账户、来源 IP 和后续进程活动。';
      } else if (['24', '39', '4779'].includes(eventId)) {
        result.note = '会话断开不等于注销，用户进程可能仍在后台运行。';
      } else if (['25', '4778'].includes(eventId)) {
        result.level = 'medium';
        result.label = '需核查';
        result.note = '已有 RDP 会话被重新连接，检查是否来自新的来源地址或异常时间。';
      }

      if (eventId === '7045' || item.category === '服务创建') {
        result.level = suspiciousServicePath(item.command) ? 'high' : 'medium';
        result.label = result.level === 'high' ? '高关注' : '需核查';
        result.note = suspiciousServicePath(item.command)
          ? '新服务指向用户可写目录或脚本文件，优先核对签名、哈希、服务注册表和创建时间。'
          : '7045 也可能由软件安装和驱动更新产生；核对服务路径、启动类型、签名及对应 4697。';
      }

      if (['4720', '4728', '4732', '4756'].includes(eventId)) {
        result.level = 'high';
        result.label = '高关注';
        result.note = eventId === '4720'
          ? '发现新用户创建，确认工单、创建者和是否随后加入高权限组。'
          : '发现用户加入组，重点确认 Administrators、Remote Desktop Users 等高权限组变更。';
      } else if (['4724', '4725', '4726', '4729', '4733', '4757'].includes(eventId)) {
        result.level = 'medium';
        result.label = '需核查';
        result.note = '账户或组成员关系发生敏感变更，核对操作者、目标 SID 和变更原因。';
      }

      if (item.category === 'PowerShell日志') {
        if (isWinTraceLensCollector(combined)) {
          result.level = 'info';
          result.label = '工具活动';
          result.note = '该事件由 WinTraceLens 事件日志采集过程产生，已从新增采集结果中排除；旧记录仅作为工具活动显示。';
        } else if (suspiciousPowerShell(primaryCommand)) {
          result.level = 'high';
          result.label = '高关注';
          result.note = '命令包含编码、下载、隐藏执行或动态加载特征；查看完整脚本块并关联父进程和网络连接。';

      }

      if (item.category === 'SQL Server日志') {

          result.label = '高关注';

        }
      }
      return result;
    }

    function metric(label, value, tone = '') {
      return `<span class="count ${tone}">${escapeCell(label)} ${escapeCell(value)}</span>`;
    }

    function renderSummary(items) {
      const high = items.filter(item => reviewFor(item, items).level === 'high').length;
      const medium = items.filter(item => reviewFor(item, items).level === 'medium').length;
      const metrics = [metric('当前结果', items.length), metric('高关注', high, high ? 'bad' : ''), metric('需核查', medium, medium ? 'warn' : '')];
      if (activeTab === 'logon') {
        metrics.push(metric('成功', items.filter(x => x.eventId === '4624').length, 'ok'));
        metrics.push(metric('失败', items.filter(x => x.eventId === '4625').length, 'bad'));
        metrics.push(metric('网络登录', items.filter(x => x.logonType === '3').length));
        metrics.push(metric('RDP类型10', items.filter(x => x.logonType === '10').length, 'warn'));
      } else if (activeTab === 'rdp') {
        metrics.push(metric('NLA认证1149', items.filter(x => x.eventId === '1149').length));
        metrics.push(metric('会话登录21', items.filter(x => x.eventId === '21').length, 'ok'));
        metrics.push(metric('断开/注销', items.filter(x => ['23', '24', '39', '4779'].includes(x.eventId)).length));
      } else if (activeTab === 'service') {
        metrics.push(metric('可疑路径', items.filter(x => suspiciousServicePath(x.command)).length, 'bad'));
      } else if (activeTab === 'user') {
        metrics.push(metric('用户创建', items.filter(x => x.eventId === '4720').length, 'warn'));
        metrics.push(metric('加入组', items.filter(x => ['4728', '4732', '4756'].includes(x.eventId)).length, 'bad'));
      } else if (activeTab === 'powershell') {
        metrics.push(metric('脚本块4104', items.filter(x => x.eventId === '4104').length));
        metrics.push(metric('可疑命令', items.filter(x => {
          const combinedContent = `${x.command || ''} ${x.message || ''} ${x.details || ''}`;
          const primaryContent = x.command || x.message || x.details || '';
          return !isWinTraceLensCollector(combinedContent) && suspiciousPowerShell(primaryContent);
        }).length, 'bad'));
      } else if (activeTab === 'sql') {
        metrics.push(metric('登录失败', items.filter(x => /(18456|login failed|登录失败)/i.test(`${x.eventId} ${x.message}`)).length, 'bad'));
      } else {
        metrics.push(metric('登录失败', items.filter(x => x.eventId === '4625').length, 'bad'));
        metrics.push(metric('RDP', items.filter(x => tabMatches(x, 'rdp')).length, 'warn'));
        metrics.push(metric('服务创建', items.filter(x => tabMatches(x, 'service')).length, 'warn'));
      }
      summaryEl.innerHTML = metrics.join('');
    }

    function relevantErrors() {
      if (activeTab === 'all') return collectionErrors;
      const markers = {
        logon: ['安全日志', 'Security'],
        rdp: ['RDP', 'TerminalServices'],
        service: ['服务创建', '7045'],
        user: ['安全日志', 'Security'],
        powershell: ['PowerShell'],
        sql: ['SQL Server']
      }[activeTab] || [];
      return collectionErrors.filter(error => markers.some(marker => text(error).toLowerCase().includes(marker.toLowerCase())));
    }

      const view = viewDefinitions[activeTab] || viewDefinitions.all;

    function riskBadge(review) {
      return `<span class="risk-badge ${escapeCell(review.level)}">${escapeCell(review.label)}</span>`;
    }

    function renderCell(column, item, review) {
      const kind = column[2];
      if (kind === 'risk') return riskBadge(review);
      if (kind === 'note') return escapeCell(review.note);
      if (kind === 'detail') return `<button class="row-detail" data-event-key="${escapeCell(item.__key)}">详情</button>`;
      const value = typeof kind === 'function' ? kind(item) : item[kind];
      return escapeCell(value || '-');
    }

    function defaultSortState(view) {
      const riskIndex = view.columns.findIndex(column => column[2] === 'risk');
      return { index: riskIndex >= 0 ? riskIndex : 0, direction: 'desc' };
    }

    function currentSortState(view) {
      if (!sortByTab[activeTab]) {
        sortByTab[activeTab] = defaultSortState(view);
      }
      return sortByTab[activeTab];
    }

    function riskRank(level) {
      if (level === 'high') return 3;
      if (level === 'medium') return 2;
      return 1;
    }

    function sortValue(column, item, review) {
      const kind = column[2];
      if (kind === 'risk') return riskRank(review.level);
      if (kind === 'note') return review.note;
      if (typeof kind === 'function') return kind(item);
      return item[kind];
    }

    function compareValues(left, right) {
      const leftText = text(left).trim();
      const rightText = text(right).trim();
      if (!leftText && !rightText) return 0;
      if (!leftText) return 1;
      if (!rightText) return -1;
      const leftNumber = Number(leftText);
      const rightNumber = Number(rightText);
      if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) {
        return leftNumber - rightNumber;
      }
      return leftText.localeCompare(rightText, 'zh-CN', { numeric: true, sensitivity: 'base' });
    }

    function sortedItems(items, view, scopeItems) {
      const state = currentSortState(view);
      const column = view.columns[state.index] || view.columns[0];
      const decorated = items.map((item, index) => ({
        item,
        index,
        review: reviewFor(item, scopeItems)
      }));
      decorated.sort((left, right) => {
        const leftValue = sortValue(column, left.item, left.review);
        const rightValue = sortValue(column, right.item, right.review);
        const leftEmpty = !text(leftValue).trim();
        const rightEmpty = !text(rightValue).trim();
        if (leftEmpty !== rightEmpty) return leftEmpty ? 1 : -1;
        let result = compareValues(leftValue, rightValue);
        if (state.direction === 'desc') result *= -1;
        if (result !== 0) return result;
        const timeResult = text(right.item.time).localeCompare(text(left.item.time));
        return timeResult || left.index - right.index;
      });
      return decorated.map(entry => entry.item);
    }

    function sortIndicator(index, view) {
      const state = currentSortState(view);
      if (state.index !== index) return '↕';
      return state.direction === 'asc' ? '↑' : '↓';
    }

    function renderHeader(column, index, view) {
      if (column[2] === 'detail') {
        return `<th class="${escapeCell(column[1])}">${escapeCell(column[0])}</th>`;
      }
      const state = currentSortState(view);
      const ariaSort = state.index === index ? (state.direction === 'asc' ? 'ascending' : 'descending') : 'none';
      return `<th class="${escapeCell(column[1])}" aria-sort="${ariaSort}">
        <button class="sort-head" data-sort-index="${index}" title="按${escapeCell(column[0])}排序">
          <span>${escapeCell(column[0])}</span><span class="sort-indicator">${sortIndicator(index, view)}</span>
        </button>
      </th>`;
    }

    function healthStatusTone(value) {
      if (value === '可用') return 'ok';
      if (value === '无事件' || value === '未启用') return 'warn';
      return 'bad';

    function render() {
      if (activeTab === 'health') {
        renderHealth();
        return;
      }
      let items = visibleItems();
      const scopeItems = events.filter(item => tabMatches(item));
      const view = viewDefinitions[activeTab] || viewDefinitions.all;
      buildReviewContext(scopeItems);
      items = sortedItems(items, view, scopeItems);
      updateTabs();
      renderContext();
      renderSummary(items);
      const activeLabel = document.querySelector(`button.tab[data-tab="${activeTab}"]`)?.dataset.label || '全部';
      const sortState = currentSortState(view);
      const sortColumn = view.columns[sortState.index] || view.columns[0];
      statusEl.textContent = `${activeLabel} ${items.length} / ${scopeItems.length} · ${sortColumn[0]}${sortState.direction === 'asc' ? '升序' : '降序'}`;

        ).join('')}</tr>`;

    }

    const detailFields = [
      ['时间', 'time'], ['分类', 'category'], ['动作', 'action'], ['事件 ID', 'eventId'],
      ['日志来源', 'source'], ['Provider', 'provider'], ['级别', 'level'], ['账户/实例', 'account'],
      ['域', 'domain'], ['操作者', 'subject'], ['目标 SID', 'targetSid'], ['登录类型', 'logonType'],
      ['登录类型说明', 'logonTypeName'], ['来源 IP', 'sourceIp'], ['来源端口', 'sourcePort'],
      ['工作站', 'workstation'], ['进程', 'process'], ['服务名', 'serviceName'], ['命令/路径', 'command'],
      ['认证包', 'authPackage'], ['状态', 'status'], ['失败原因', 'failureReason'], ['消息', 'message'], ['补充详情', 'details']
    ];

    function showEventDetail(key) {
      const item = events.find(event => event.__key === key);
      if (!item) return;
      const review = reviewFor(item, events.filter(candidate => tabMatches(candidate, activeTab)));
      const rows = [
        ['研判级别', review.label],
        ['研判备注', review.note],
        ...detailFields.filter(([, field]) => text(item[field]).trim()).map(([label, field]) => [label, item[field]])
      ];
      detailTitleEl.textContent = `${item.action || item.category || '事件详情'} · ${item.time || ''}`;
      detailContentEl.innerHTML = `<div class="detail-grid">${rows.map(([label, value]) =>
        `<div>${escapeCell(label)}</div><div>${escapeCell(value)}</div>`
      ).join('')}</div>`;
      detailRawText = rows.map(([label, value]) => `${label}: ${value}`).join('\n');
      detailOverlayEl.hidden = false;
    }

    function closeEventDetail() {
      detailOverlayEl.hidden = true;
      detailRawText = '';
    }

    async function loadJSON(url, options) {
      const res = await fetch(url, options || { cache: 'no-store' });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || res.statusText);
      }
      return res.json();
    }

    function downloadCSV(url) {
      window.wtlDownload(url).catch(err => {
        statusEl.textContent = `导出失败：${err.message || err}`;
      });
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function setRecentDays(days) {
      const end = new Date();
      const start = new Date();
      start.setDate(end.getDate() - Math.max(0, days - 1));
      startDate.value = formatDate(start);
      endDate.value = formatDate(end);
    }

    function validateDateRange() {
      if (startDate.value && endDate.value && startDate.value > endDate.value) {
        throw new Error('结束日期不能早于开始日期');
      }
    }

    function appendDateRange(params) {
      if (startDate.value) params.set('start', startDate.value);
      if (endDate.value) params.set('end', endDate.value);
      return params;
    }

    function rangeText() {
      if (!startDate.value && !endDate.value) return '全部时间';
      if (startDate.value && endDate.value) return `${startDate.value} 至 ${endDate.value}`;
      if (startDate.value) return `${startDate.value} 之后`;
      return `${endDate.value} 之前`;
    }

    function collectionQueryString(force = false) {
      validateDateRange();
      const params = new URLSearchParams({ max: maxRecords.value || '300' });
      if (force) params.set('refresh', '1');
      return appendDateRange(params).toString();
    }

    function queryString() {
      validateDateRange();
      const params = new URLSearchParams({ max: maxRecords.value || '300', category: activeTab });
      const q = filter.value.trim();
      if (q) params.set('q', q);
      return appendDateRange(params).toString();
    }

    async function load(force = false) {
      let params;
      try {
        params = collectionQueryString(force);
      } catch (err) {
        statusEl.textContent = err.message;
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        return;
      }
      statusEl.textContent = `正在读取 Windows 事件日志（${rangeText()}，最多 ${maxRecords.value || '300'} 条）...`;
      exportCSV.disabled = true;
      summaryEl.innerHTML = '';
      table.innerHTML = `<div class="empty">正在读取 ${escapeCell(rangeText())} 的登录、RDP、服务、用户、PowerShell、SQL Server 相关事件，最多 ${escapeCell(maxRecords.value || '300')} 条...</div>`;
      const data = await loadJSON(`/api/security/events?${params}`);
      events = (data.events || []).map((item, index) => ({ ...item, __key: String(index) }));
      collectionErrors = data.collectionErrors || [];
      exportCSV.disabled = false;
      statusEl.textContent = `生成时间 ${data.generatedAt || ''}，范围 ${rangeText()}，事件 ${events.length}`;
      render();
    }

    async function loadHealth(force = false) {
      statusEl.textContent = '正在检查日志源...';
      exportCSV.disabled = true;
      summaryEl.innerHTML = '';
      table.innerHTML = '<div class="empty">正在检查安全日志、Sysmon、WFP、防火墙、PowerShell、RDP、SQL Server 和 DNS 来源...</div>';
      const data = await loadJSON(`/api/log/health${force ? '?refresh=1' : ''}`);
      healthSources = data.sources || [];
      healthSummary = data.summary || {};
      healthGeneratedAt = data.generatedAt || '';
      render();
    }

    document.getElementById('refresh').addEventListener('click', () => {
      const loader = activeTab === 'health' ? loadHealth(true) : load(true);
      loader.catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    exportCSV.addEventListener('click', () => {
      try {
        statusEl.textContent = '正在生成 CSV...';
        if (activeTab === 'health') {
          const q = filter.value.trim();
          downloadCSV(`/api/log/health.csv${q ? `?q=${encodeURIComponent(q)}` : ''}`);
        } else {
          downloadCSV(`/api/security/events.csv?${queryString()}`);
        }
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });

    table.addEventListener('click', event => {
      const sortButton = event.target.closest('button[data-sort-index]');
      if (sortButton) {
        const view = viewDefinitions[activeTab] || viewDefinitions.all;
        const index = Number(sortButton.dataset.sortIndex);
        const column = view.columns[index];
        if (!column || column[2] === 'detail') return;
        const current = currentSortState(view);
        if (current.index === index) {
          current.direction = current.direction === 'asc' ? 'desc' : 'asc';
        } else {
          current.index = index;
          current.direction = column[2] === 'risk' || column[2] === 'time' ? 'desc' : 'asc';
        }
        render();
        return;
      }
      const button = event.target.closest('button[data-event-key]');
      if (button) showEventDetail(button.dataset.eventKey);
    });
    detailCloseEl.addEventListener('click', closeEventDetail);
    detailCopyEl.addEventListener('click', async () => {
      if (!detailRawText) return;
      await navigator.clipboard.writeText(detailRawText);
      statusEl.textContent = '事件原始信息已复制';
    });
    detailOverlayEl.addEventListener('click', event => {
      if (event.target === detailOverlayEl) closeEventDetail();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !detailOverlayEl.hidden) closeEventDetail();
    });

    document.getElementById('range-1d').addEventListener('click', () => {
      setRecentDays(1);
      load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    document.getElementById('range-7d').addEventListener('click', () => {
      setRecentDays(7);
      load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    document.getElementById('range-30d').addEventListener('click', () => {
      setRecentDays(30);
      load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    document.getElementById('range-clear').addEventListener('click', () => {
      startDate.value = '';
      endDate.value = '';
      load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    document.querySelectorAll('button.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        history.replaceState(null, '', activeTab === 'all' ? '/security.html' : `/security.html?tab=${encodeURIComponent(activeTab)}`);
        closeEventDetail();
        if (activeTab === 'health' && !healthSources.length) {
          loadHealth(false).catch(err => {
            table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
            statusEl.textContent = '检查失败';
          });
        } else {
          render();
        }
      });
    });

    filter.addEventListener('input', render);
    startDate.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    endDate.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    maxRecords.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));

    setRecentDays(7);
    const initialLoad = activeTab === 'health' ? loadHealth(false) : load(false);
    initialLoad.catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    });
  </script>
</body>
</html>
