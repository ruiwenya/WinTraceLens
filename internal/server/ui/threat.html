<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTraceLens - 威胁分析</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #182235;
      --muted: #5b6678;
      --head: #243447;
      --head-2: #edf3f8;
      --accent: #1769aa;
      --accent-dark: #0f4e82;
      --ok: #176b43;
      --warn: #9a5200;
      --bad: #a41220;
      --info: #2b5b91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 18px;
      background: var(--head);
      color: #fff;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr);
      gap: 10px;
      height: calc(100vh - 48px);
      min-height: 680px;
      padding: 12px;
    }
    .toolbar, .tabs, .summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, select {
      width: min(520px, 100%);
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    select {
      width: 128px;
      min-width: 128px;
    }
    label.toggle {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 5px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      font-size: 13px;
      white-space: nowrap;
    }
    label.toggle input {
      width: 14px;
      height: 14px;
      padding: 0;
      margin: 0;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent-dark);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    button.secondary, button.tab {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab.active {
      border-color: var(--accent);
      background: #e8f2fb;
      color: var(--accent-dark);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.ok { border-color: #b8d7c8; background: #edf8f2; color: var(--ok); }
    .badge.warn { border-color: #f0ce9f; background: #fff7e8; color: var(--warn); }
    .badge.bad { border-color: #edb4bd; background: #fff0f2; color: var(--bad); }
    .badge.info { border-color: #c7d7ee; background: #eef5fd; color: var(--info); }
    .panel {
      grid-row: 5;
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }
    .table-wrap {
      height: 100%;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1820px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.memory-table { min-width: 2100px; }
    .memory-table .category { width: 110px; }
    .memory-table .process { width: 150px; }
    .memory-table .reason { width: 220px; }
    .memory-table .context { width: 180px; }
    .memory-table .path { width: 320px; }
    .memory-table .preview { width: 260px; }
    .memory-table .action { width: 130px; }
    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head-2);
      color: #26384f;
      font-weight: 650;
    }
    tbody tr:hover td { background: #f3f8ff; }
    tbody tr.high td { background: #fff0f2; }
    tbody tr.medium td { background: #fff9ed; }
    .level { width: 78px; }
    .category { width: 120px; }
    .pid { width: 80px; }
    .process { width: 170px; }
    .driver { width: 190px; }
    .service { width: 220px; }
    .kind { width: 130px; }
    .score { width: 70px; }
    .signature { width: 150px; }
    .connections { width: 80px; }
    .address { width: 150px; font-family: Consolas, "Courier New", monospace; }
    .size { width: 100px; }
    .protect { width: 150px; }
    .path { width: 420px; }
    .reason { width: 280px; }
    .context { width: 230px; }
    .details { width: 420px; }
	.hash { width: 460px; font-family: Consolas, "Courier New", monospace; }
	.preview { width: 360px; }
	.action { width: 145px; }
    .empty {
      padding: 18px;
      color: var(--muted);
    }
    .bad-text { color: var(--bad); }
    .driver-workbench {
      grid-row: 4;
      display: grid;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .driver-workbench[hidden] { display: none; }
    .driver-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .driver-actions strong { font-size: 14px; }
    .quick-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick-filters button {
      height: 30px;
      padding: 0 10px;
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    .quick-filters button.active {
      border-color: var(--accent);
      background: #e8f2fb;
      color: var(--accent-dark);
    }
    .check-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
    }
    .check-item {
      flex: 0 0 265px;
      min-width: 265px;
      height: 84px;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-left: 4px solid #8aa0b8;
      border-radius: 4px;
      background: #fbfcfe;
    }
    .check-item.high { border-left-color: var(--bad); background: #fff8f9; }
    .check-item.medium { border-left-color: var(--warn); background: #fffbf3; }
    .check-item .check-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .check-item strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .check-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .boundary-note {
      padding: 8px 10px;
      border-left: 4px solid #6f8094;
      background: #f3f6f9;
      color: #46566b;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #dfeaf4; }
    .sort-mark { color: var(--accent); }
	dialog { width: min(980px, calc(100vw - 40px)); max-height: calc(100vh - 60px); padding: 0; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 16px 48px rgba(20,38,62,.28); }
	dialog::backdrop { background: rgba(16,28,42,.42); }
	.dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--head-2); }
	.dialog-head h2 { margin:0; font-size:16px; }
	.dialog-body { max-height: calc(100vh - 150px); overflow:auto; padding:14px; }
	.dialog-grid { display:grid; grid-template-columns: 160px minmax(0,1fr); gap:1px; border:1px solid var(--line); background:var(--line); }
	.dialog-grid dt,.dialog-grid dd { margin:0; padding:8px 10px; background:#fff; overflow-wrap:anywhere; }
	.dialog-grid dt { color:var(--muted); font-weight:600; }
	.dialog-code { margin-top:12px; padding:10px; overflow:auto; border:1px solid var(--line); background:#f7f9fc; font:12px/1.55 Consolas,"Courier New",monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
  <link rel="stylesheet" href="/nav.css">
  <script src="/app.js"></script>
</head>
<body>
  <header>
    <h1>WinTraceLens</h1>
    <div class="app-meta">
      <span class="release-badge" data-app-version>2.0 预览版</span>
      <span class="permission-badge unknown" data-admin-status>权限检测中</span>
      <span class="module-title">V2 威胁分析与多源核查</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <nav class="top-nav" aria-label="主要功能">
        <a class="nav-link" href="/">进程信息</a>
        <a class="nav-link" href="/host.html">主机信息</a>
        <a class="nav-link" href="/findings.html">风险线索</a>
        <a class="nav-link" aria-current="page" href="/threat.html">威胁分析</a>
        <a class="nav-link" href="/investigation.html">案件调查</a>
        <a class="nav-link" href="/filetrace.html">文件痕迹</a>
        <a class="nav-link" href="/history.html">历史通信</a>
        <a class="nav-link" href="/security.html">事件日志</a>
        <a class="nav-link" href="/yara.html">YARA扫描</a>
        <a class="nav-link" href="/ai.html">AI分析</a>
      </nav>
      <span class="current-module">当前：威胁分析</span>
      <button id="refresh">刷新分析</button>
      <button id="export-csv" class="secondary" disabled>导出 CSV</button>
      <select id="max-records" title="最多返回条数">
        <option value="300">最多 300</option>
        <option value="500" selected>最多 500</option>
        <option value="1000">最多 1000</option>
      </select>
      <select id="process-limit" title="内存扫描进程数">
        <option value="80">进程 80</option>
        <option value="160">进程 160</option>
        <option value="300" selected>进程 300</option>
      </select>
      <label class="toggle" title="开启后额外枚举线程起始地址；仅异常入口会增加结果"><input id="include-threads" type="checkbox" checked>线程入口</label>
      <input id="filter" placeholder="按进程、PID、路径、原因过滤；支持 /正则/i">
      <span id="status" class="status">尚未加载</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="memory">内存异常</button>
      <button class="tab" data-tab="drivers">内核驱动风险</button>
    </div>

    <div id="summary" class="summary"></div>

    <section id="driver-workbench" class="driver-workbench" hidden>
      <div class="driver-actions">
        <strong>V2 多源核查</strong>
        <div class="quick-filters" aria-label="驱动风险快捷筛选">
          <button class="active" data-driver-filter="all">全部风险</button>
          <button data-driver-filter="high">仅高风险</button>
          <button data-driver-filter="source">多源不一致</button>
          <button data-driver-filter="missing">文件缺失</button>
          <button data-driver-filter="unsigned">签名异常</button>
          <button data-driver-filter="events">有事件证据</button>
          <button id="export-checks">导出核查摘要</button>
        </div>
      </div>
      <div id="driver-checks" class="check-grid"></div>
      <div id="driver-boundary" class="boundary-note"></div>
    </section>

    <section class="panel">
      <div id="table" class="table-wrap">
        <div class="empty">正在加载威胁分析...</div>
      </div>
    </section>
  </main>

  <dialog id="memory-detail-dialog">
	<div class="dialog-head"><h2 id="memory-detail-title">内存区域详情</h2><button id="memory-detail-close" class="secondary">关闭</button></div>
	<div id="memory-detail-body" class="dialog-body"></div>
  </dialog>

  <script>
    const table = document.getElementById('table');
    const filter = document.getElementById('filter');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const exportCSV = document.getElementById('export-csv');
    const maxRecords = document.getElementById('max-records');
    const processLimit = document.getElementById('process-limit');
    const includeThreads = document.getElementById('include-threads');
    const driverWorkbench = document.getElementById('driver-workbench');
    const driverChecksEl = document.getElementById('driver-checks');
    const driverBoundaryEl = document.getElementById('driver-boundary');
    let activeTab = 'memory';
    let memoryRecords = [];
    let driverItems = [];
    let collectionErrors = [];
    let sourceSummary = '';
    let generatedAt = '';
    let driverChecks = [];
    let driverBoundary = '';
    let driverSourceCounts = {};
    let driverRiskFilter = 'all';
    let driverSort = { key: 'score', direction: 'desc' };
	let memorySort = { key: 'level', direction: 'desc' };
	const memoryDialog = document.getElementById('memory-detail-dialog');
	const memoryDialogBody = document.getElementById('memory-detail-body');

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeCell(value) {
      return text(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function levelBadge(value) {
      if (value === '高') return '<span class="badge bad">高</span>';
      if (value === '中') return '<span class="badge warn">中</span>';
      if (value === '低') return '<span class="badge info">低</span>';
      return '<span class="badge ok">-</span>';
    }

    function rowClass(item) {
      if (item.level === '高') return 'high';
      if (item.level === '中') return 'medium';
      return '';
    }

    function formatSize(value) {
      const n = Number(value || 0);
      if (!n) return '';
      if (n >= 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${n} B`;
    }

    function visibleItems() {
      const q = filter.value.trim();
      let items = activeTab === 'memory' ? memoryRecords : driverItems;
      if (activeTab === 'drivers') {
        items = items.filter(matchesDriverRiskFilter);
        items = sortDriverRows(items);
	  } else {
		items = sortMemoryRows(items);
      }
      if (!q) return items;
      return items.filter(item => window.wtlMatchesQuery(q, Object.values(item)));
    }

    function matchesDriverRiskFilter(item) {
      if (driverRiskFilter === 'high') return item.level === '高';
      if (driverRiskFilter === 'source') return text(item.sourceDiff).includes('无') && item.kind !== '系统转储驱动';
      if (driverRiskFilter === 'missing') return text(item.reason).includes('文件缺失') || text(item.reason).includes('当前磁盘未匹配') || text(item.hashError).includes('找不到');
      if (driverRiskFilter === 'unsigned') return ['无签名请注意!!!', '签名异常'].includes(item.signature) || text(item.reason).includes('未签名');
      if (driverRiskFilter === 'events') return Boolean(text(item.eventMatches).trim());
      return true;
    }

    function driverSortValue(item, key) {
      if (['score', 'sizeKb'].includes(key)) return Number(item[key] || 0);
      if (key === 'level') return ({ '高': 3, '中': 2, '低': 1 }[item.level] || 0);
      return text(item[key]).toLowerCase();
    }

    function sortDriverRows(items) {
      const direction = driverSort.direction === 'asc' ? 1 : -1;
      return [...items].sort((a, b) => {
        const av = driverSortValue(a, driverSort.key);
        const bv = driverSortValue(b, driverSort.key);
        if (av < bv) return -1 * direction;
        if (av > bv) return 1 * direction;
        return text(a.name).localeCompare(text(b.name), 'zh-CN');
      });
    }

    function driverHeader(label, key, className) {
      const active = driverSort.key === key;
      const mark = active ? (driverSort.direction === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th class="${className || ''} sortable" data-sort="${key}" title="单击按${escapeCell(label)}排序">${escapeCell(label)}<span class="sort-mark">${mark}</span></th>`;
    }

	function memorySortValue(item, key) {
	  if (['size', 'entropy', 'pid'].includes(key)) return Number(item[key] || 0);
	  if (key === 'level') return ({ '高': 3, '中': 2, '低': 1 }[item.level] || 0);
	  return text(item[key]).toLowerCase();
	}

	function sortMemoryRows(items) {
	  const direction = memorySort.direction === 'asc' ? 1 : -1;
	  return [...items].sort((a, b) => {
		const av = memorySortValue(a, memorySort.key), bv = memorySortValue(b, memorySort.key);
		if (av < bv) return -1 * direction;
		if (av > bv) return 1 * direction;
		return Number(a.pid || 0) - Number(b.pid || 0);
	  });
	}

	function memoryHeader(label, key, className) {
	  const active = memorySort.key === key;
	  const mark = active ? (memorySort.direction === 'asc' ? ' ↑' : ' ↓') : '';
	  return `<th class="${className || ''} sortable" data-memory-sort="${key}" title="单击按${escapeCell(label)}排序">${escapeCell(label)}<span class="sort-mark">${mark}</span></th>`;
	}

    function renderSummary() {
      const items = activeTab === 'memory' ? memoryRecords : driverItems;
      const high = items.filter(x => x.level === '高').length;
      const medium = items.filter(x => x.level === '中').length;
      const low = items.filter(x => x.level === '低').length;
      const threadEntries = activeTab === 'memory' ? items.filter(x => x.category === '线程入口').length : 0;
      const errors = collectionErrors.slice(0, 4).map(x => `<span class="bad-text" title="${escapeCell(x)}">${escapeCell(x)}</span>`).join('');
      summaryEl.innerHTML = [
        `<span class="badge info">总数 ${items.length}</span>`,
        `<span class="badge bad">高 ${high}</span>`,
        `<span class="badge warn">中 ${medium}</span>`,
        `<span class="badge info">低 ${low}</span>`,
        activeTab === 'memory' ? (includeThreads.checked
          ? `<span class="badge info" title="已执行线程起始地址核查，只显示异常入口">线程入口 已检查 · 异常 ${threadEntries}</span>`
          : '<span class="badge ok" title="本次未枚举线程起始地址">线程入口 未检查</span>') : '',
        generatedAt ? `<span class="badge ok">${escapeCell(generatedAt)}</span>` : '',
        sourceSummary ? `<span class="badge info" title="${escapeCell(sourceSummary)}">${escapeCell(sourceSummary)}</span>` : '',
        errors
      ].join('');
    }

    function renderDriverWorkbench() {
      driverWorkbench.hidden = activeTab !== 'drivers';
      if (activeTab !== 'drivers') return;
      document.querySelectorAll('[data-driver-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.driverFilter === driverRiskFilter);
      });
      driverChecksEl.innerHTML = driverChecks.map(check => {
        const css = check.level === '高' ? 'high' : (check.level === '中' ? 'medium' : '');
        const badge = check.level === '高' ? 'bad' : (check.level === '中' ? 'warn' : 'info');
        const samples = (check.samples || []).join('；');
        return `<article class="check-item ${css}" title="${escapeCell(check.recommendation)}${samples ? `\n样例：${escapeCell(samples)}` : ''}">
          <div class="check-head"><strong>${escapeCell(check.title)}</strong><span class="badge ${badge}">${escapeCell(check.status)} ${escapeCell(check.count)}</span></div>
          <p>${escapeCell(check.detail)}</p>
        </article>`;
      }).join('');
      const counts = driverSourceCounts || {};
      driverBoundaryEl.innerHTML = `<strong>检测边界：</strong>${escapeCell(driverBoundary)} ` +
        `<span>本次证据源：内核 ${escapeCell(counts.kernelModules || 0)}、Services ${escapeCell(counts.registryDrivers || 0)}、磁盘 ${escapeCell(counts.diskDrivers || 0)}、Amcache ${escapeCell(counts.amcacheDrivers || 0)}、事件 ${escapeCell(counts.loadEvents || 0)}。</span>`;
      driverBoundaryEl.title = `${driverBoundary} 本次证据源：内核 ${counts.kernelModules || 0}、Services ${counts.registryDrivers || 0}、磁盘 ${counts.diskDrivers || 0}、Amcache ${counts.amcacheDrivers || 0}、事件 ${counts.loadEvents || 0}。`;
    }

    function renderMemory() {
      const items = visibleItems();
      if (!items.length) {
        table.innerHTML = '<div class="empty">没有匹配的内存异常结果</div>';
        return;
      }
      table.innerHTML = `<table class="memory-table">
        <thead><tr>
		  ${memoryHeader('级别','level','level')}${memoryHeader('分类','category','category')}${memoryHeader('PID','pid','pid')}${memoryHeader('进程','process','process')}
		  ${memoryHeader('原因','reason','reason')}${memoryHeader('大小','size','size')}${memoryHeader('内存类型','memoryType','category')}
		  ${memoryHeader('熵','entropy','size')}<th class="reason">硬信号</th><th class="context">上下文</th><th class="path">进程路径</th><th class="preview">字符串预览</th><th class="action">操作</th>
        </tr></thead>
        <tbody>${items.map(item => `<tr class="${rowClass(item)}">
          <td class="level">${levelBadge(item.level)}</td>
          <td class="category" title="${escapeCell(item.category)}">${escapeCell(item.category)}</td>
          <td class="pid">${escapeCell(item.pid)}</td>
          <td class="process" title="${escapeCell(item.process)}">${escapeCell(item.process)}</td>
          <td class="reason" title="${escapeCell(item.reason)}">${escapeCell(item.reason)}</td>
          <td class="size" title="${escapeCell(item.size)}">${escapeCell(formatSize(item.size))}</td>
          <td class="category" title="${escapeCell(item.memoryType)}">${escapeCell(item.memoryType)}</td>
		  <td class="size" title="${escapeCell(item.entropy)}">${escapeCell(Number(item.entropy || 0).toFixed(2))}</td>
		  <td class="reason" title="${escapeCell((item.hardSignals || []).join('；'))}">${escapeCell((item.hardSignals || []).join('；'))}</td>
          <td class="context" title="${escapeCell(item.context)}">${escapeCell(item.context)}</td>
          <td class="path" title="${escapeCell(item.path)}">${escapeCell(item.path)}</td>
		  <td class="preview" title="${escapeCell(item.stringsPreview)}">${escapeCell(item.stringsPreview)}</td>
		  <td class="action"><button class="secondary memory-detail" data-index="${memoryRecords.indexOf(item)}">详情</button> <button class="secondary memory-export" data-pid="${escapeCell(item.pid)}" data-base="${escapeCell(item.regionBase)}" data-size="${escapeCell(item.size)}" ${item.exportable?'':'disabled'}>导出</button></td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

	function showMemoryDetail(item) {
	  document.getElementById('memory-detail-title').textContent = `${item.process || '进程'} | PID ${item.pid || '-'} | ${item.regionBase || item.base || '-'}`;
	  const rows = [
		['风险/原因', `${item.level || '-'} | ${item.reason || '-'}`], ['进程路径', item.path], ['区域基址', item.regionBase], ['入口/地址', item.base],
		['区域大小', `${formatSize(item.size)} (${item.size || 0} bytes)`], ['内存类型', item.memoryType], ['当前保护', item.protect], ['初始保护', item.allocationProtect],
		['后备文件', item.backingFile || '未解析到'], ['异常线程', item.threadId || '-'], ['SHA-256', item.sha256], ['哈希范围', item.hashScope],
		['熵', Number(item.entropy || 0).toFixed(2)], ['MZ / PE', `${item.hasMZ ? 'MZ' : '-'} / ${item.hasPE ? '有效 PE' : '-'}`],
		['硬信号', (item.hardSignals || []).join('；')], ['可信上下文', item.context], ['补充详情', item.details]
	  ];
	  memoryDialogBody.innerHTML = `<dl class="dialog-grid">${rows.map(([k,v])=>`<dt>${escapeCell(k)}</dt><dd>${escapeCell(v || '-')}</dd>`).join('')}</dl><div class="dialog-code"><strong>十六进制预览</strong>\n${escapeCell(item.hexPreview || '-')}\n\n<strong>可打印字符串预览</strong>\n${escapeCell(item.stringsPreview || '-')}</div>`;
	  if (typeof memoryDialog.showModal === 'function') memoryDialog.showModal(); else memoryDialog.setAttribute('open','');
	}

    function renderDrivers() {
      const items = visibleItems();
      if (!items.length) {
        table.innerHTML = '<div class="empty">没有匹配的内核驱动风险结果</div>';
        return;
      }
      table.innerHTML = `<table style="min-width: 3820px">
        <thead><tr>
          ${driverHeader('级别', 'level', 'level')}${driverHeader('评分', 'score', 'score')}${driverHeader('驱动名', 'name', 'driver')}${driverHeader('类型', 'kind', 'kind')}
          ${driverHeader('签名', 'signature', 'signature')}<th class="details">签名说明</th>${driverHeader('MD5', 'md5', 'address')}${driverHeader('基址', 'baseAddress', 'address')}
          ${driverHeader('大小', 'sizeKb', 'size')}${driverHeader('路径', 'path', 'path')}${driverHeader('服务项', 'serviceName', 'service')}${driverHeader('启动', 'serviceStart', 'kind')}
          <th class="path">服务ImagePath</th><th class="path">注册表路径</th>${driverHeader('事件关联', 'eventMatches', 'details')}
          <th class="path">磁盘路径</th>${driverHeader('Amcache路径', 'amcachePath', 'path')}${driverHeader('Amcache SHA1', 'amcacheSha1', 'address')}
          ${driverHeader('Amcache记录时间', 'amcacheTime', 'details')}<th class="details">Amcache信息</th>${driverHeader('多源差异', 'sourceDiff', 'details')}
          ${driverHeader('原因', 'reason', 'reason')}<th class="details">证据</th>
        </tr></thead>
        <tbody>${items.map(item => `<tr class="${rowClass(item)}">
          <td class="level">${levelBadge(item.level)}</td>
          <td class="score">${escapeCell(item.score)}</td>
          <td class="driver" title="${escapeCell(item.name)}">${escapeCell(item.name)}</td>
          <td class="kind" title="${escapeCell(item.kind)}">${escapeCell(item.kind)}</td>
          <td class="signature" title="${escapeCell(item.signature)}">${escapeCell(item.signature)}</td>
          <td class="details" title="${escapeCell(item.signatureMsg)}">${escapeCell(item.signatureMsg)}</td>
          <td class="address" title="${escapeCell(item.md5 || item.hashError)}">${escapeCell(item.md5 || item.hashError)}</td>
          <td class="address" title="${escapeCell(item.baseAddress)}">${escapeCell(item.baseAddress)}</td>
          <td class="size" title="${escapeCell(item.sizeKb)}">${escapeCell(formatSize(Number(item.sizeKb || 0) * 1024))}</td>
          <td class="path" title="${escapeCell(item.path)}">${escapeCell(item.path)}</td>
          <td class="service" title="${escapeCell(item.serviceName)}">${escapeCell(item.serviceName)}</td>
          <td class="kind" title="${escapeCell(item.serviceStart || item.serviceType)}">${escapeCell(item.serviceStart || item.serviceType)}</td>
          <td class="path" title="${escapeCell(item.serviceImage)}">${escapeCell(item.serviceImage)}</td>
          <td class="path" title="${escapeCell(item.registryPath)}">${escapeCell(item.registryPath)}</td>
          <td class="details" title="${escapeCell(item.eventMatches)}">${escapeCell(item.eventMatches)}</td>
          <td class="path" title="${escapeCell(item.diskPath)}">${escapeCell(item.diskPath)}</td>
          <td class="path" title="${escapeCell(item.amcachePath)}">${escapeCell(item.amcachePath)}</td>
          <td class="address" title="${escapeCell(item.amcacheSha1)}">${escapeCell(item.amcacheSha1)}</td>
          <td class="details" title="${escapeCell(item.amcacheTime)}">${escapeCell(item.amcacheTime)}</td>
          <td class="details" title="${escapeCell(item.amcacheInfo)}">${escapeCell(item.amcacheInfo)}</td>
          <td class="details" title="${escapeCell(item.sourceDiff)}">${escapeCell(item.sourceDiff)}</td>
          <td class="reason" title="${escapeCell(item.reason)}">${escapeCell(item.reason)}</td>
          <td class="details" title="${escapeCell(item.evidence)}">${escapeCell(item.evidence)}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function render() {
      document.querySelectorAll('button.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === activeTab));
      processLimit.disabled = activeTab !== 'memory';
      includeThreads.disabled = activeTab !== 'memory';
      const items = visibleItems();
      statusEl.textContent = `显示 ${items.length} 条`;
      renderSummary();
      renderDriverWorkbench();
      if (activeTab === 'memory') renderMemory();
      else renderDrivers();
    }

    async function loadJSON(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(await res.text() || res.statusText);
      return res.json();
    }

    function queryString(includeFilter, force = false) {
      const params = new URLSearchParams({
        max: maxRecords.value || '500'
      });
      if (activeTab === 'memory') {
        params.set('processes', processLimit.value || '300');
        params.set('regions', '64');
        params.set('threads', includeThreads.checked ? '1' : '0');
      }
      const q = filter.value.trim();
      if (includeFilter && q) params.set('q', q);
      if (force) params.set('refresh', '1');
      return params.toString();
    }

    async function load(force = false) {
      exportCSV.disabled = true;
      collectionErrors = [];
      sourceSummary = '';
      generatedAt = '';
      summaryEl.innerHTML = '';
      if (activeTab === 'memory') {
        statusEl.textContent = '正在扫描进程内存异常...';
        table.innerHTML = '<div class="empty">正在枚举虚拟内存区域和线程入口...</div>';
        const data = await loadJSON(`/api/threat/memory?${queryString(false, force)}`);
        memoryRecords = data.records || [];
        collectionErrors = data.collectionErrors || [];
        generatedAt = data.generatedAt || '';
        sourceSummary = `扫描进程 ${data.scannedProcesses || 0}，跳过 ${data.skippedProcesses || 0}`;
      } else {
        statusEl.textContent = '正在分析内核驱动风险...';
        table.innerHTML = '<div class="empty">正在交叉核查 PID 4 内核模块、Services、磁盘驱动、Amcache 历史清单与加载事件...</div>';
        const data = await loadJSON(`/api/threat/drivers?${queryString(false, force)}`);
        driverItems = data.items || [];
        driverChecks = data.checks || [];
        driverBoundary = data.boundary || '';
        driverSourceCounts = data.sourceCounts || {};
        collectionErrors = data.collectionErrors || [];
        generatedAt = data.generatedAt || '';
        sourceSummary = data.sourceSummary || '';
      }
      exportCSV.disabled = false;
      render();
    }

    function downloadCSV(url) {
      window.wtlDownload(url).catch(err => {
        statusEl.textContent = `导出失败：${err.message || err}`;
      });
    }

    document.getElementById('refresh').addEventListener('click', () => {
      load(true).catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    exportCSV.addEventListener('click', () => {
      const endpoint = activeTab === 'memory' ? '/api/threat/memory.csv' : '/api/threat/drivers.csv';
      statusEl.textContent = '正在生成 CSV...';
      downloadCSV(`${endpoint}?${queryString(true)}`);
    });

    document.getElementById('export-checks').addEventListener('click', () => {
      statusEl.textContent = '正在生成 V2 核查摘要 CSV...';
      downloadCSV(`/api/threat/driver-checks.csv?${queryString(false)}`);
    });

    document.querySelectorAll('[data-driver-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        driverRiskFilter = btn.dataset.driverFilter;
        render();
      });
    });

    table.addEventListener('click', event => {
	  const detailButton = event.target.closest('.memory-detail');
	  if (detailButton && activeTab === 'memory') {
		const item = memoryRecords[Number(detailButton.dataset.index)];
		if (item) showMemoryDetail(item);
		return;
	  }
	  const exportButton = event.target.closest('.memory-export');
	  if (exportButton && activeTab === 'memory') {
		exportButton.disabled = true;
		statusEl.textContent = '正在导出选中异常区域...';
		const params = new URLSearchParams({pid:exportButton.dataset.pid,base:exportButton.dataset.base,size:exportButton.dataset.size});
		window.wtlDownload(`/api/threat/memory/export?${params}`).then(()=>statusEl.textContent='异常内存区域证据已导出').catch(err=>statusEl.textContent=`导出失败：${err.message||err}`).finally(()=>exportButton.disabled=false);
		return;
	  }
	  const memoryHeaderEl = event.target.closest('th[data-memory-sort]');
	  if (memoryHeaderEl && activeTab === 'memory') {
		const key=memoryHeaderEl.dataset.memorySort;
		if(memorySort.key===key)memorySort.direction=memorySort.direction==='asc'?'desc':'asc';else memorySort={key,direction:['level','pid','size','entropy'].includes(key)?'desc':'asc'};
		render();
		return;
	  }
      const header = event.target.closest('th[data-sort]');
      if (!header || activeTab !== 'drivers') return;
      const key = header.dataset.sort;
      if (driverSort.key === key) driverSort.direction = driverSort.direction === 'asc' ? 'desc' : 'asc';
      else driverSort = { key, direction: ['score', 'sizeKb', 'level'].includes(key) ? 'desc' : 'asc' };
      render();
    });
	document.getElementById('memory-detail-close').addEventListener('click',()=>memoryDialog.close());

    document.querySelectorAll('button.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        load().catch(err => {
          table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
          statusEl.textContent = '加载失败';
        });
      });
    });

    filter.addEventListener('input', render);
    maxRecords.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    processLimit.addEventListener('change', () => {
      if (activeTab === 'memory') load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });
    includeThreads.addEventListener('change', () => {
      if (activeTab === 'memory') load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });
    load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    });
  </script>
</body>
</html>
