<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTraceLens - 威胁分析</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #182235;
      --muted: #5b6678;
      --head: #243447;
      --head-2: #edf3f8;
      --accent: #1769aa;
      --accent-dark: #0f4e82;
      --ok: #176b43;
      --warn: #9a5200;
      --bad: #a41220;
      --info: #2b5b91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 18px;
      background: var(--head);
      color: #fff;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 10px;
      height: calc(100vh - 48px);
      padding: 12px;
    }
    .toolbar, .tabs, .summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, select {
      width: min(520px, 100%);
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    select {
      width: 128px;
      min-width: 128px;
    }
    label.toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      white-space: nowrap;
    }
    label.toggle input {
      width: 16px;
      height: 16px;
      padding: 0;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent-dark);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    button.secondary, button.tab {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab.active {
      border-color: var(--accent);
      background: #e8f2fb;
      color: var(--accent-dark);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.ok { border-color: #b8d7c8; background: #edf8f2; color: var(--ok); }
    .badge.warn { border-color: #f0ce9f; background: #fff7e8; color: var(--warn); }
    .badge.bad { border-color: #edb4bd; background: #fff0f2; color: var(--bad); }
    .badge.info { border-color: #c7d7ee; background: #eef5fd; color: var(--info); }
    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }
    .table-wrap {
      height: 100%;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1820px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head-2);
      color: #26384f;
      font-weight: 650;
    }
    tbody tr:hover td { background: #f3f8ff; }
    tbody tr.high td { background: #fff0f2; }
    tbody tr.medium td { background: #fff9ed; }
    .level { width: 78px; }
    .category { width: 120px; }
    .pid { width: 80px; }
    .process { width: 170px; }
    .score { width: 70px; }
    .signature { width: 150px; }
    .connections { width: 80px; }
    .address { width: 150px; font-family: Consolas, "Courier New", monospace; }
    .size { width: 100px; }
    .protect { width: 150px; }
    .path { width: 420px; }
    .reason { width: 280px; }
    .context { width: 230px; }
    .details { width: 420px; }
    .empty {
      padding: 18px;
      color: var(--muted);
    }
    .bad-text { color: var(--bad); }
  </style>
  <link rel="stylesheet" href="/nav.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>WinTraceLens</h1>
    <div class="app-meta">
      <span class="release-badge" data-app-version>1.0 基础版</span>
      <span class="permission-badge unknown" data-admin-status>权限检测中</span>
      <span class="module-title">内存异常与行为关联</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <nav class="top-nav" aria-label="主要功能">
        <a class="nav-link" href="/">进程信息</a>
        <a class="nav-link" href="/host.html">主机信息</a>
        <a class="nav-link" href="/findings.html">关注项</a>
        <a class="nav-link" aria-current="page" href="/threat.html">威胁分析</a>
        <a class="nav-link" href="/filetrace.html">文件痕迹</a>
        <a class="nav-link" href="/history.html">历史通信</a>
        <a class="nav-link" href="/security.html">事件日志</a>
        <a class="nav-link" href="/health.html">日志健康</a>
        <a class="nav-link" href="/yara.html">YARA扫描</a>
        <a class="nav-link" href="/ai.html">AI分析</a>
      </nav>
      <span class="current-module">当前：威胁分析</span>
      <button id="refresh">刷新分析</button>
      <button id="export-csv" class="secondary" disabled>导出 CSV</button>
      <select id="max-records" title="最多返回条数">
        <option value="300">最多 300</option>
        <option value="500" selected>最多 500</option>
        <option value="1000">最多 1000</option>
      </select>
      <select id="process-limit" title="内存扫描进程数">
        <option value="80">进程 80</option>
        <option value="160">进程 160</option>
        <option value="300" selected>进程 300</option>
      </select>
      <label class="toggle"><input id="include-threads" type="checkbox" checked>线程入口</label>
      <label class="toggle"><input id="include-filetrace" type="checkbox">关联文件痕迹</label>
      <input id="filter" placeholder="按进程、PID、路径、原因、证据过滤">
      <span id="status" class="status">尚未加载</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="behavior">行为关联</button>
      <button class="tab" data-tab="memory">内存异常</button>
    </div>

    <div id="summary" class="summary"></div>

    <section class="panel">
      <div id="table" class="table-wrap">
        <div class="empty">正在加载威胁分析...</div>
      </div>
    </section>
  </main>

  <script>
    const table = document.getElementById('table');
    const filter = document.getElementById('filter');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const exportCSV = document.getElementById('export-csv');
    const maxRecords = document.getElementById('max-records');
    const processLimit = document.getElementById('process-limit');
    const includeThreads = document.getElementById('include-threads');
    const includeFileTrace = document.getElementById('include-filetrace');
    let activeTab = 'behavior';
    let behaviorItems = [];
    let memoryRecords = [];
    let collectionErrors = [];
    let sourceSummary = '';
    let generatedAt = '';

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeCell(value) {
      return text(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function levelBadge(value) {
      if (value === '高') return '<span class="badge bad">高</span>';
      if (value === '中') return '<span class="badge warn">中</span>';
      if (value === '低') return '<span class="badge info">低</span>';
      return '<span class="badge ok">-</span>';
    }

    function rowClass(item) {
      if (item.level === '高') return 'high';
      if (item.level === '中') return 'medium';
      return '';
    }

    function formatSize(value) {
      const n = Number(value || 0);
      if (!n) return '';
      if (n >= 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${n} B`;
    }

    function visibleItems() {
      const q = filter.value.trim().toLowerCase();
      const items = activeTab === 'memory' ? memoryRecords : behaviorItems;
      if (!q) return items;
      return items.filter(item => Object.values(item).some(v => text(v).toLowerCase().includes(q)));
    }

    function renderSummary() {
      const items = activeTab === 'memory' ? memoryRecords : behaviorItems;
      const high = items.filter(x => x.level === '高').length;
      const medium = items.filter(x => x.level === '中').length;
      const low = items.filter(x => x.level === '低').length;
      const errors = collectionErrors.slice(0, 4).map(x => `<span class="bad-text" title="${escapeCell(x)}">${escapeCell(x)}</span>`).join('');
      summaryEl.innerHTML = [
        `<span class="badge info">总数 ${items.length}</span>`,
        `<span class="badge bad">高 ${high}</span>`,
        `<span class="badge warn">中 ${medium}</span>`,
        `<span class="badge info">低 ${low}</span>`,
        generatedAt ? `<span class="badge ok">${escapeCell(generatedAt)}</span>` : '',
        sourceSummary ? `<span class="badge info" title="${escapeCell(sourceSummary)}">${escapeCell(sourceSummary)}</span>` : '',
        errors
      ].join('');
    }

    function renderBehavior() {
      const items = visibleItems();
      if (!items.length) {
        table.innerHTML = '<div class="empty">没有匹配的行为关联结果</div>';
        return;
      }
      table.innerHTML = `<table>
        <thead><tr>
          <th class="level">级别</th><th class="category">场景</th><th class="score">评分</th><th class="pid">PID</th>
          <th class="process">进程/来源</th><th class="connections">连接</th><th class="signature">签名</th>
          <th class="path">路径</th><th class="reason">摘要</th><th class="details">证据</th><th class="details">关联信号</th>
        </tr></thead>
        <tbody>${items.map(item => `<tr class="${rowClass(item)}">
          <td class="level">${levelBadge(item.level)}</td>
          <td class="category" title="${escapeCell(item.scenario)}">${escapeCell(item.scenario)}</td>
          <td class="score">${escapeCell(item.score)}</td>
          <td class="pid">${escapeCell(item.pid || '')}</td>
          <td class="process" title="${escapeCell(item.process)}">${escapeCell(item.process)}</td>
          <td class="connections">${escapeCell(item.connections || '')}</td>
          <td class="signature" title="${escapeCell(item.signature)}">${escapeCell(item.signature)}</td>
          <td class="path" title="${escapeCell(item.path)}">${escapeCell(item.path)}</td>
          <td class="reason" title="${escapeCell(item.summary)}">${escapeCell(item.summary)}</td>
          <td class="details" title="${escapeCell(item.evidence)}">${escapeCell(item.evidence)}</td>
          <td class="details" title="${escapeCell(item.related)}">${escapeCell(item.related)}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function renderMemory() {
      const items = visibleItems();
      if (!items.length) {
        table.innerHTML = '<div class="empty">没有匹配的内存异常结果</div>';
        return;
      }
      table.innerHTML = `<table>
        <thead><tr>
          <th class="level">级别</th><th class="category">分类</th><th class="pid">PID</th><th class="process">进程</th>
          <th class="reason">原因</th><th class="address">基址/入口</th><th class="size">大小</th><th class="protect">保护属性</th>
          <th class="category">内存类型</th><th class="pid">线程</th><th class="context">上下文</th><th class="path">路径</th><th class="details">详情</th>
        </tr></thead>
        <tbody>${items.map(item => `<tr class="${rowClass(item)}">
          <td class="level">${levelBadge(item.level)}</td>
          <td class="category" title="${escapeCell(item.category)}">${escapeCell(item.category)}</td>
          <td class="pid">${escapeCell(item.pid)}</td>
          <td class="process" title="${escapeCell(item.process)}">${escapeCell(item.process)}</td>
          <td class="reason" title="${escapeCell(item.reason)}">${escapeCell(item.reason)}</td>
          <td class="address" title="${escapeCell(item.base)}">${escapeCell(item.base)}</td>
          <td class="size" title="${escapeCell(item.size)}">${escapeCell(formatSize(item.size))}</td>
          <td class="protect" title="${escapeCell(item.protect)}">${escapeCell(item.protect)}</td>
          <td class="category" title="${escapeCell(item.memoryType)}">${escapeCell(item.memoryType)}</td>
          <td class="pid">${escapeCell(item.threadId || '')}</td>
          <td class="context" title="${escapeCell(item.context)}">${escapeCell(item.context)}</td>
          <td class="path" title="${escapeCell(item.path)}">${escapeCell(item.path)}</td>
          <td class="details" title="${escapeCell(item.details)}">${escapeCell(item.details)}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function render() {
      document.querySelectorAll('button.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === activeTab));
      const items = visibleItems();
      statusEl.textContent = `显示 ${items.length} 条`;
      renderSummary();
      if (activeTab === 'memory') renderMemory(); else renderBehavior();
    }

    async function loadJSON(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(await res.text() || res.statusText);
      return res.json();
    }

    function queryString(includeFilter) {
      const params = new URLSearchParams({
        max: maxRecords.value || '500'
      });
      if (activeTab === 'memory') {
        params.set('processes', processLimit.value || '300');
        params.set('regions', '64');
        params.set('threads', includeThreads.checked ? '1' : '0');
      } else {
        params.set('memory', '1');
        params.set('filetrace', includeFileTrace.checked ? '1' : '0');
      }
      const q = filter.value.trim();
      if (includeFilter && q) params.set('q', q);
      return params.toString();
    }

    async function load() {
      exportCSV.disabled = true;
      collectionErrors = [];
      sourceSummary = '';
      generatedAt = '';
      summaryEl.innerHTML = '';
      if (activeTab === 'memory') {
        statusEl.textContent = '正在扫描进程内存异常...';
        table.innerHTML = '<div class="empty">正在枚举虚拟内存区域和线程入口...</div>';
        const data = await loadJSON(`/api/threat/memory?${queryString(false)}`);
        memoryRecords = data.records || [];
        collectionErrors = data.collectionErrors || [];
        generatedAt = data.generatedAt || '';
        sourceSummary = `扫描进程 ${data.scannedProcesses || 0}，跳过 ${data.skippedProcesses || 0}`;
      } else {
        statusEl.textContent = '正在做行为关联分析...';
        table.innerHTML = '<div class="empty">正在关联进程、持久化、网络连接和内存异常...</div>';
        const data = await loadJSON(`/api/threat/behavior?${queryString(false)}`);
        behaviorItems = data.items || [];
        collectionErrors = data.collectionErrors || [];
        generatedAt = data.generatedAt || '';
        sourceSummary = data.sourceSummary || '';
      }
      exportCSV.disabled = false;
      render();
    }

    function downloadCSV(url) {
      const a = document.createElement('a');
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    document.getElementById('refresh').addEventListener('click', () => {
      load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    exportCSV.addEventListener('click', () => {
      const endpoint = activeTab === 'memory' ? '/api/threat/memory.csv' : '/api/threat/behavior.csv';
      statusEl.textContent = '正在生成 CSV...';
      downloadCSV(`${endpoint}?${queryString(true)}`);
    });

    document.querySelectorAll('button.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        load().catch(err => {
          table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
          statusEl.textContent = '加载失败';
        });
      });
    });

    filter.addEventListener('input', render);
    maxRecords.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    processLimit.addEventListener('change', () => {
      if (activeTab === 'memory') load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });
    includeThreads.addEventListener('change', () => {
      if (activeTab === 'memory') load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });
    includeFileTrace.addEventListener('change', () => {
      if (activeTab === 'behavior') load().catch(err => {
        table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    load().catch(err => {
      table.innerHTML = `<div class="empty bad-text">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    });
  </script>
</body>
</html>
