<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTraceLens - AI辅助分析</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #182235;
      --muted: #5b6678;
      --head: #243447;
      --head-2: #edf3f8;
      --accent: #1769aa;
      --accent-dark: #0f4e82;
      --ok: #176b43;
      --warn: #9a5200;
      --bad: #a41220;
      --info: #2b5b91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 18px;
      background: var(--head);
      color: #fff;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      height: calc(100vh - 48px);
      padding: 12px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 470px) minmax(0, 1fr);
      gap: 10px;
      height: 100%;
      min-height: 0;
    }
    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--head-2);
      color: #26384f;
      font-weight: 650;
    }
    .panel-body {
      display: grid;
      gap: 10px;
      padding: 12px;
      min-height: 0;
      overflow: auto;
    }
    label.field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
    }
    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
      letter-spacing: 0;
    }
    input,
    select {
      height: 34px;
      padding: 6px 10px;
    }
    textarea {
      min-height: 118px;
      resize: vertical;
      padding: 9px 10px;
      line-height: 1.45;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
    }
    .check input {
      width: 16px;
      height: 16px;
      padding: 0;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent-dark);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    button.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.warn {
      border-color: #b15e00;
      background: #c96d00;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .notice {
      padding: 9px 10px;
      border: 1px solid #f0ce9f;
      border-radius: 4px;
      background: #fff7e8;
      color: var(--warn);
      line-height: 1.45;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
    }
    .summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 30px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.ok { border-color: #b8d7c8; background: #edf8f2; color: var(--ok); }
    .badge.warn { border-color: #f0ce9f; background: #fff7e8; color: var(--warn); }
    .badge.bad { border-color: #edb4bd; background: #fff0f2; color: var(--bad); }
    .badge.info { border-color: #c7d7ee; background: #eef5fd; color: var(--info); }
    .result-wrap {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      min-height: 0;
    }
    .source-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-top: 4px;
    }
    .source-table th,
    .source-table td {
      border-bottom: 1px solid var(--line-soft);
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .source-table th {
      background: #f8fafc;
      color: #26384f;
      font-weight: 650;
    }
    .chat-log {
      min-height: 0;
      padding: 12px;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 10px;
      background: #fbfcfe;
    }
    .message {
      display: grid;
      gap: 5px;
      max-width: min(920px, 100%);
    }
    .message.user {
      justify-self: end;
    }
    .message.assistant {
      justify-self: start;
    }
    .message-meta {
      color: var(--muted);
      font-size: 12px;
    }
    .message.user .message-meta {
      text-align: right;
    }
    .bubble {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(24, 34, 53, 0.05);
      line-height: 1.55;
      word-break: break-word;
    }
    .message.user .bubble {
      border-color: #b9d4ee;
      background: #eaf4fd;
    }
    .assistant-content h3,
    .assistant-content h4 {
      margin: 8px 0 6px;
      color: #26384f;
      font-size: 15px;
    }
    .assistant-content p {
      margin: 5px 0;
    }
    .assistant-content strong {
      color: #0f4e82;
      font-weight: 700;
    }
    .assistant-content code {
      padding: 1px 4px;
      border: 1px solid #dce5ef;
      border-radius: 3px;
      background: #f4f7fb;
      font: 12px Consolas, "Courier New", monospace;
    }
    .assistant-content .list-line {
      padding-left: 10px;
      border-left: 2px solid #dbe8f5;
    }
    .code-block {
      margin: 8px 0;
      padding: 9px 10px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f6f8fb;
      font: 12px/1.45 Consolas, "Courier New", monospace;
      white-space: pre;
    }
    .chat-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .chat-composer textarea {
      min-height: 52px;
      max-height: 120px;
    }
    .chat-composer button {
      align-self: end;
      min-width: 86px;
    }
    .empty {
      padding: 18px;
      color: var(--muted);
    }
    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      main {
        height: auto;
        min-height: calc(100vh - 48px);
      }
    }
    @media (max-width: 640px) {
      .grid-2,
      .module-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="/nav.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>WinTraceLens</h1>
    <div class="app-meta">
      <span class="release-badge" data-app-version>1.0 基础版</span>
      <span class="permission-badge unknown" data-admin-status>权限检测中</span>
      <span class="module-title">在线 AI 辅助研判</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <nav class="top-nav" aria-label="主要功能">
        <a class="nav-link" href="/">进程信息</a>
        <a class="nav-link" href="/host.html">主机信息</a>
        <a class="nav-link" href="/findings.html">关注项</a>
        <a class="nav-link" href="/threat.html">威胁分析</a>
        <a class="nav-link" href="/filetrace.html">文件痕迹</a>
        <a class="nav-link" href="/history.html">历史通信</a>
        <a class="nav-link" href="/security.html">事件日志</a>
        <a class="nav-link" href="/health.html">日志健康</a>
        <a class="nav-link" href="/yara.html">YARA扫描</a>
        <a class="nav-link" aria-current="page" href="/ai.html">AI分析</a>
      </nav>
      <span class="current-module">当前：AI分析</span>
      <span id="status" class="status">尚未分析</span>
    </div>

    <div class="workspace">
      <section class="panel">
        <div class="panel-header">
          <span>分析配置</span>
        </div>
        <div class="panel-body">
          <div class="notice">在线 AI 会接收所选模块摘要；API Key 只用于本次请求，不写入本机配置。</div>

          <div class="grid-2">
            <label class="field">AI厂商
              <select id="provider">
                <option value="openai">OpenAI</option>
                <option value="deepseek">DeepSeek</option>
                <option value="kimi">Kimi</option>
                <option value="qwen">Qwen</option>
                <option value="custom">自定义兼容接口</option>
              </select>
            </label>
            <label class="field">模型
              <select id="model"></select>
            </label>
          </div>

          <label id="custom-model-wrap" class="field" hidden>自定义模型名
            <input id="custom-model" placeholder="例如 qwen-plus 或 deepseek-chat">
          </label>

          <label class="field">API Key
            <input id="api-key" type="password" autocomplete="off" placeholder="输入当前厂商的 API Key">
          </label>

          <label class="field">接口地址
            <input id="base-url" placeholder="OpenAI-compatible base URL">
          </label>

          <div class="grid-2">
            <label class="field">每个模块最多发送
              <select id="max-items">
                <option value="40">40 条</option>
                <option value="80" selected>80 条</option>
                <option value="150">150 条</option>
                <option value="300">300 条</option>
              </select>
            </label>
            <label class="field">请求超时
              <select id="timeout">
                <option value="60">60 秒</option>
                <option value="90" selected>90 秒</option>
                <option value="150">150 秒</option>
                <option value="240">240 秒</option>
              </select>
            </label>
          </div>

          <div class="module-grid">
            <label class="check"><input type="checkbox" name="section" value="processes" checked>进程信息</label>
            <label class="check"><input type="checkbox" name="section" value="findings" checked>关注项</label>
            <label class="check"><input type="checkbox" name="section" value="behavior" checked>行为关联</label>
            <label class="check"><input type="checkbox" name="section" value="loghealth" checked>日志健康</label>
            <label class="check"><input type="checkbox" name="section" value="host">主机信息</label>
            <label class="check"><input type="checkbox" name="section" value="memory">内存异常</label>
            <label class="check"><input type="checkbox" name="section" value="filetrace">文件痕迹</label>
            <label class="check"><input type="checkbox" name="section" value="history">历史通信</label>
            <label class="check"><input type="checkbox" name="section" value="security">事件日志</label>
          </div>

          <label class="field">分析目标
            <textarea id="question">请分析当前主机是否存在挖矿木马、蠕虫、远控木马、异常登录或持久化风险，并给出下一步排查建议。</textarea>
          </label>

          <div class="actions">
            <button id="analyze">开始 AI 分析</button>
            <button id="stop" class="warn" disabled>停止请求</button>
            <button id="copy" class="secondary" disabled>复制结果</button>
            <button id="clear" class="secondary">重新开始</button>
          </div>
        </div>
      </section>

      <section class="panel result-wrap">
        <div class="panel-header">
          <span>分析结果</span>
          <span id="result-meta" class="status"></span>
        </div>
        <div id="summary" class="panel-body"></div>
        <div id="chat" class="chat-log">
          <div class="empty">等待提交分析任务。</div>
        </div>
        <div class="chat-composer">
          <textarea id="follow-up" placeholder="继续追问，例如：这些高连接进程下一步该看哪些证据？" disabled></textarea>
          <button id="send-follow" disabled>发送</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const providerEl = document.getElementById('provider');
    const modelEl = document.getElementById('model');
    const customModelWrap = document.getElementById('custom-model-wrap');
    const customModelEl = document.getElementById('custom-model');
    const apiKeyEl = document.getElementById('api-key');
    const baseUrlEl = document.getElementById('base-url');
    const maxItemsEl = document.getElementById('max-items');
    const timeoutEl = document.getElementById('timeout');
    const questionEl = document.getElementById('question');
    const analyzeBtn = document.getElementById('analyze');
    const stopBtn = document.getElementById('stop');
    const copyBtn = document.getElementById('copy');
    const clearBtn = document.getElementById('clear');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const chatEl = document.getElementById('chat');
    const followUpEl = document.getElementById('follow-up');
    const sendFollowBtn = document.getElementById('send-follow');
    const resultMetaEl = document.getElementById('result-meta');

    const providers = {
      openai: {
        baseUrl: 'https://api.openai.com/v1',
        models: ['gpt-5.5', 'gpt-5.4-mini', 'gpt-5.4-nano', 'gpt-5.4', 'gpt-5.5-mini']
      },
      deepseek: {
        baseUrl: 'https://api.deepseek.com',
        models: ['deepseek-v4-flash', 'deepseek-v4-pro', 'deepseek-chat', 'deepseek-reasoner']
      },
      kimi: {
        baseUrl: 'https://api.moonshot.ai/v1',
        models: ['kimi-k2.6', 'kimi-k2.5', 'kimi-k2', 'kimi-latest', 'moonshot-v1-8k']
      },
      qwen: {
        baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1',
        models: ['qwen3.7-plus', 'qwen3.7-max', 'qwen-plus', 'qwen-max', 'qwen-turbo']
      },
      custom: {
        baseUrl: '',
        models: ['custom']
      }
    };

    let controller = null;
    let chatHistory = [];
    let lastTranscript = '';
    let lastSummaryData = null;
    let apiKeys = {};
    let restoringSession = false;
    let saveTimer = null;

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeCell(value) {
      return text(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function inlineMarkdown(value) {
      return escapeCell(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*{2}([^*]+)\*{2}/g, '<strong>$1</strong>');
    }

    function selectedSections() {
      return Array.from(document.querySelectorAll('input[name="section"]:checked')).map(item => item.value);
    }

    function selectedModel() {
      if (modelEl.value === 'custom') {
        return customModelEl.value.trim();
      }
      return modelEl.value;
    }

    function updateProvider() {
      const config = providers[providerEl.value] || providers.openai;
      modelEl.innerHTML = config.models.map(model => `<option value="${escapeCell(model)}">${escapeCell(model)}</option>`).join('') +
        '<option value="custom">自定义模型</option>';
      baseUrlEl.value = config.baseUrl;
      updateCustomModel();
      apiKeyEl.value = apiKeys[providerEl.value] || '';
    }

    function updateCustomModel() {
      customModelWrap.hidden = modelEl.value !== 'custom';
    }

    function setBusy(value) {
      analyzeBtn.disabled = value;
      stopBtn.disabled = !value;
      providerEl.disabled = value;
      modelEl.disabled = value;
      customModelEl.disabled = value;
      apiKeyEl.disabled = value;
      baseUrlEl.disabled = value;
      maxItemsEl.disabled = value;
      timeoutEl.disabled = value;
      questionEl.disabled = value;
      document.querySelectorAll('input[name="section"]').forEach(item => item.disabled = value);
      followUpEl.disabled = value || chatHistory.length === 0;
      sendFollowBtn.disabled = value || chatHistory.length === 0;
    }

    function renderSummary(data) {
      const badges = [
        `<span class="badge info">${escapeCell(data.provider || '')}</span>`,
        `<span class="badge info">${escapeCell(data.model || '')}</span>`,
        `<span class="badge">Prompt ${escapeCell(data.promptBytes || 0)} bytes</span>`
      ];
      if (data.usage && data.usage.totalTokens) {
        badges.push(`<span class="badge ok">Token ${escapeCell(data.usage.totalTokens)}</span>`);
      }
      const errors = data.collectionErrors || [];
      if (errors.length) {
        badges.push(`<span class="badge warn">采集提示 ${errors.length}</span>`);
      }

      const sections = data.sections || [];
      const rows = sections.map(item => `
        <tr>
          <td>${escapeCell(item.label)}</td>
          <td>${escapeCell(item.count)}</td>
          <td>${escapeCell(item.error || '')}</td>
        </tr>`).join('');

      summaryEl.innerHTML = `
        <div class="summary">${badges.join('')}</div>
        <table class="source-table">
          <thead><tr><th style="width:130px">模块</th><th style="width:90px">数量</th><th>采集提示</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="3">无模块摘要</td></tr>'}</tbody>
        </table>`;
    }

    function renderPlainMarkdown(value) {
      const lines = text(value).split(/\r?\n/);
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '<p></p>';
        if (/^#{1,3}\s+/.test(trimmed)) {
          return `<h3>${inlineMarkdown(trimmed.replace(/^#{1,3}\s+/, ''))}</h3>`;
        }
        if (/^#{4,6}\s+/.test(trimmed)) {
          return `<h4>${inlineMarkdown(trimmed.replace(/^#{4,6}\s+/, ''))}</h4>`;
        }
        if (/^(\d+[.、]|[-*])\s+/.test(trimmed)) {
          return `<p class="list-line">${inlineMarkdown(trimmed)}</p>`;
        }
        return `<p>${inlineMarkdown(line)}</p>`;
      }).join('');
    }

    function renderAssistantContent(value) {
      const parts = text(value).split(/```/);
      return parts.map((part, index) => {
        if (index % 2 === 1) {
          const code = part.replace(/^[^\r\n]*(\r?\n)/, '');
          return `<pre class="code-block"><code>${escapeCell(code)}</code></pre>`;
        }
        return renderPlainMarkdown(part);
      }).join('');
    }

    function renderChat() {
      if (!chatHistory.length) {
        chatEl.innerHTML = '<div class="empty">等待提交分析任务。</div>';
        followUpEl.disabled = true;
        sendFollowBtn.disabled = true;
        copyBtn.disabled = true;
        lastTranscript = '';
        return;
      }
      chatEl.innerHTML = chatHistory.map(item => {
        const roleName = item.role === 'user' ? '用户' : 'AI';
        const content = item.role === 'assistant'
          ? `<div class="assistant-content">${renderAssistantContent(item.content)}</div>`
          : escapeCell(item.content);
        return `
          <div class="message ${escapeCell(item.role)}">
            <div class="message-meta">${roleName}</div>
            <div class="bubble">${content}</div>
          </div>`;
      }).join('');
      chatEl.scrollTop = chatEl.scrollHeight;
      followUpEl.disabled = false;
      sendFollowBtn.disabled = false;
      copyBtn.disabled = false;
      lastTranscript = chatHistory.map(item => `${item.role === 'user' ? '用户' : 'AI'}：\n${item.content}`).join('\n\n');
    }

    function currentSettings() {
      return {
        provider: providerEl.value,
        model: modelEl.value,
        customModel: customModelEl.value.trim(),
        baseUrl: baseUrlEl.value.trim(),
        sections: selectedSections(),
        question: questionEl.value,
        maxItems: Number(maxItemsEl.value),
        timeout: Number(timeoutEl.value)
      };
    }

    function currentAPIKeys() {
      const keys = { ...apiKeys };
      const key = apiKeyEl.value.trim();
      if (key) {
        keys[providerEl.value] = key;
      } else {
        delete keys[providerEl.value];
      }
      return keys;
    }

    function applySettings(settings) {
      if (!settings) return;
      restoringSession = true;
      try {
        if (settings.provider && providers[settings.provider]) {
          providerEl.value = settings.provider;
          updateProvider();
        }
        if (settings.model) {
          const option = Array.from(modelEl.options).find(item => item.value === settings.model);
          if (option) {
            modelEl.value = settings.model;
          } else {
            modelEl.value = 'custom';
            customModelEl.value = settings.customModel || settings.model;
          }
        }
        if (settings.customModel) customModelEl.value = settings.customModel;
        if (settings.baseUrl) baseUrlEl.value = settings.baseUrl;
        if (settings.maxItems) maxItemsEl.value = String(settings.maxItems);
        if (settings.timeout) timeoutEl.value = String(settings.timeout);
        if (settings.question) questionEl.value = settings.question;
        if (Array.isArray(settings.sections) && settings.sections.length) {
          const selected = new Set(settings.sections);
          document.querySelectorAll('input[name="section"]').forEach(item => {
            item.checked = selected.has(item.value);
          });
        }
        updateCustomModel();
      } finally {
        restoringSession = false;
      }
    }

    async function saveSession(statusText) {
      if (restoringSession) return;
      try {
        await fetch('/api/ai/session', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: chatHistory,
            summary: lastSummaryData || {},
            settings: currentSettings(),
            apiKeys: currentAPIKeys(),
            status: statusText || statusEl.textContent || ''
          })
        });
      } catch {
        statusEl.textContent = '会话状态保存失败';
      }
    }

    function scheduleSaveSession() {
      if (restoringSession) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveSession(statusEl.textContent), 250);
    }

    async function loadSession() {
      restoringSession = true;
      try {
        const res = await fetch('/api/ai/session', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const state = await res.json();
        apiKeys = state.apiKeys || {};
        applySettings(state.settings);
        apiKeyEl.value = apiKeys[providerEl.value] || '';
        chatHistory = Array.isArray(state.messages) ? state.messages : [];
        lastSummaryData = state.summary && state.summary.generatedAt ? state.summary : null;
        summaryEl.innerHTML = '';
        if (lastSummaryData) {
          renderSummary(lastSummaryData);
          resultMetaEl.textContent = lastSummaryData.generatedAt || '';
        }
        renderChat();
        statusEl.textContent = state.status || (chatHistory.length ? '已恢复本次运行会话' : '尚未分析');
      } catch {
        renderChat();
        statusEl.textContent = '会话状态读取失败';
      } finally {
        restoringSession = false;
      }
    }

    function payloadBase() {
      return {
        provider: providerEl.value,
        model: selectedModel(),
        apiKey: apiKeyEl.value.trim(),
        baseUrl: baseUrlEl.value.trim(),
        maxItems: Number(maxItemsEl.value),
        timeoutSeconds: Number(timeoutEl.value)
      };
    }

    async function sendMessage(question, withEvidence) {
      const sections = selectedSections();
      const apiKey = apiKeyEl.value.trim();
      const model = selectedModel();
      question = text(question).trim();
      if (!apiKey) {
        statusEl.textContent = '请输入 API Key';
        apiKeyEl.focus();
        return;
      }
      if (!model) {
        statusEl.textContent = '请选择或输入模型名';
        return;
      }
      if (!question) {
        statusEl.textContent = '请输入要分析或追问的问题';
        return;
      }
      if (withEvidence && !sections.length) {
        statusEl.textContent = '至少选择一个数据模块';
        return;
      }

      controller = new AbortController();
      setBusy(true);
      resultMetaEl.textContent = '';
      statusEl.textContent = withEvidence ? '采集并分析中' : '追问中';

      const pendingHistory = withEvidence
        ? [{ role: 'user', content: question }]
        : [...chatHistory, { role: 'user', content: question }];
      chatHistory = [...pendingHistory, { role: 'assistant', content: '正在等待 AI 返回...' }];
      renderChat();

      try {
        const body = withEvidence
          ? { ...payloadBase(), sections, question }
          : { ...payloadBase(), messages: pendingHistory, includeEvidence: false };
        const res = await fetch('/api/ai/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify(body)
        });
        const raw = await res.text();
        if (!res.ok) {
          throw new Error(raw || `HTTP ${res.status}`);
        }
        const data = JSON.parse(raw);
        chatHistory = [...pendingHistory, { role: 'assistant', content: data.answer || 'AI 未返回内容。' }];
        resultMetaEl.textContent = data.generatedAt || '';
        if ((data.sections || []).length) {
          lastSummaryData = data;
          renderSummary(data);
        }
        renderChat();
        statusEl.textContent = withEvidence ? '分析完成' : '追问完成';
        if (!withEvidence) {
          followUpEl.value = '';
        }
        await saveSession(statusEl.textContent);
      } catch (err) {
        if (err.name === 'AbortError') {
          chatHistory = pendingHistory;
          renderChat();
          statusEl.textContent = '已停止';
          await saveSession(statusEl.textContent);
        } else {
          chatHistory = [...pendingHistory, { role: 'assistant', content: `AI 分析失败：${err.message || err}` }];
          renderChat();
          statusEl.textContent = '分析失败';
          await saveSession(statusEl.textContent);
        }
      } finally {
        setBusy(false);
        controller = null;
      }
    }

    async function analyze() {
      await sendMessage(questionEl.value, true);
    }

    async function sendFollowUp() {
      await sendMessage(followUpEl.value, false);
    }

    function stopAnalyze() {
      if (controller) {
        controller.abort();
      }
    }

    async function copyResult() {
      if (!lastTranscript) return;
      await navigator.clipboard.writeText(lastTranscript);
      statusEl.textContent = '对话已复制';
    }

    function clearResult() {
      chatHistory = [];
      lastTranscript = '';
      lastSummaryData = null;
      summaryEl.innerHTML = '';
      resultMetaEl.textContent = '';
      followUpEl.value = '';
      renderChat();
      statusEl.textContent = '尚未分析';
      saveSession(statusEl.textContent);
    }

    providerEl.addEventListener('change', () => { updateProvider(); scheduleSaveSession(); });
    modelEl.addEventListener('change', () => { updateCustomModel(); scheduleSaveSession(); });
    customModelEl.addEventListener('input', scheduleSaveSession);
    apiKeyEl.addEventListener('input', () => {
      if (apiKeyEl.value.trim()) {
        apiKeys[providerEl.value] = apiKeyEl.value.trim();
      } else {
        delete apiKeys[providerEl.value];
      }
      scheduleSaveSession();
    });
    baseUrlEl.addEventListener('input', scheduleSaveSession);
    maxItemsEl.addEventListener('change', scheduleSaveSession);
    timeoutEl.addEventListener('change', scheduleSaveSession);
    questionEl.addEventListener('input', scheduleSaveSession);
    document.querySelectorAll('input[name="section"]').forEach(item => item.addEventListener('change', scheduleSaveSession));
    analyzeBtn.addEventListener('click', analyze);
    stopBtn.addEventListener('click', stopAnalyze);
    sendFollowBtn.addEventListener('click', sendFollowUp);
    copyBtn.addEventListener('click', copyResult);
    clearBtn.addEventListener('click', clearResult);
    followUpEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        sendFollowUp();
      }
    });
    updateProvider();
    loadSession();
  </script>
</body>
</html>
