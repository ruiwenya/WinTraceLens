<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTraceLens - 文件痕迹</title>
  <script src="/theme-init.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #182235;
      --muted: #5b6678;
      --head: #243447;
      --head-2: #edf3f8;
      --accent: #1769aa;
      --accent-dark: #0f4e82;
      --ok: #176b43;
      --warn: #9a5200;
      --bad: #a41220;
      --info: #2b5b91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 18px;
      background: var(--head);
      color: #fff;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
      gap: 10px;
      height: calc(100vh - 48px);
      padding: 12px;
    }
    .toolbar, .scopebar, .tabs, .summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, select, textarea {
      width: min(460px, 100%);
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    textarea {
      width: min(720px, 100%);
      height: 38px;
      min-height: 38px;
      max-height: 88px;
      resize: vertical;
      line-height: 20px;
    }
    select {
      width: 132px;
      min-width: 132px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent-dark);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    button.secondary, button.tab {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab.active {
      border-color: var(--accent);
      background: #e8f2fb;
      color: var(--accent-dark);
    }
    button:hover { filter: brightness(0.96); }
    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .scopebar {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    .scopebar label {
      font-weight: 650;
      color: #26384f;
      white-space: nowrap;
    }
    .scope-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      flex-wrap: wrap;
    }
    #amcache-path {
      flex: 1 1 480px;
      width: auto;
      min-width: 260px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.ok { border-color: #b8d7c8; background: #edf8f2; color: var(--ok); }
    .badge.warn { border-color: #f0ce9f; background: #fff7e8; color: var(--warn); }
    .badge.bad { border-color: #edb4bd; background: #fff0f2; color: var(--bad); }
    .badge.info { border-color: #c7d7ee; background: #eef5fd; color: var(--info); }
    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      overflow: hidden;
    }
    .evidence-note {
      padding: 8px 12px;
      border-bottom: 1px solid #c7d7ee;
      background: #eef5fd;
      color: #294e78;
      font-size: 12px;
      line-height: 1.5;
    }
    .evidence-note[hidden] { display: none; }
    .operation-notices {
      padding: 8px 12px;
      border: 1px solid #c7d7ee;
      border-radius: 4px;
      background: #eef5fd;
      color: #294e78;
      font-size: 12px;
      line-height: 1.5;
    }
    .operation-notices[hidden] { display: none; }
    .table-wrap {
      height: 100%;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1660px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head-2);
      color: #26384f;
      font-weight: 650;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #dfeaf4; }
    .sort-mark { color: var(--accent); }
    tbody tr:hover td { background: #f3f8ff; }
    tbody tr.high td { background: #fff0f2; }
    tbody tr.medium td { background: #fff9ed; }
    .category { width: 112px; }
    .source { width: 130px; }
    .risk { width: 96px; }
    .name { width: 220px; }
    .time { width: 150px; }
    .size { width: 96px; }
    .path { width: 420px; }
    .reason { width: 260px; }
    .details { width: 260px; }
    .hash { width: 290px; }
    .publisher { width: 240px; }
    .product { width: 220px; }
    .association { width: 130px; }
    .schema { width: 96px; }
	.signature { width: 150px; }
	.attributes { width: 130px; }
    .empty {
      padding: 18px;
      color: var(--muted);
    }
    .bad { color: var(--bad); }
  </style>
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/tables.css">
  <script src="/app.js"></script>
  <script src="/ui-preferences.js" defer></script>
</head>
<body>
  <header>
    <h1>WinTraceLens</h1>
    <div class="app-meta">
      <span class="release-badge" data-app-version>1.0 基础版</span>
      <span class="permission-badge unknown" data-admin-status>权限检测中</span>
      <span class="module-title">最近文件与运行痕迹</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <nav class="top-nav" aria-label="主要功能">
        <a class="nav-link" href="/">进程信息</a>
        <a class="nav-link" href="/host.html">主机信息</a>
        <a class="nav-link" href="/findings.html">风险线索</a>
        <a class="nav-link" href="/threat.html">威胁分析</a>
        <a class="nav-link" href="/investigation.html">案件调查</a>
        <a class="nav-link" aria-current="page" href="/filetrace.html">文件痕迹</a>
        <a class="nav-link" href="/history.html">历史通信</a>
        <a class="nav-link" href="/security.html">事件日志</a>
        <a class="nav-link" href="/yara.html">YARA扫描</a>
        <a class="nav-link" href="/ai.html">AI分析</a>
      </nav>
      <span class="current-module">当前：文件痕迹</span>
      <select id="hours" title="最近时间范围">
        <option value="24">最近 24 小时</option>
        <option value="72" selected>最近 72 小时</option>
        <option value="168">最近 7 天</option>
        <option value="720">最近 30 天</option>
      </select>
      <select id="max-records" title="最多读取条数">
        <option value="300">最多 300</option>
        <option value="500" selected>最多 500</option>
        <option value="1000">最多 1000</option>
        <option value="2000">最多 2000</option>
      </select>
      <button id="refresh">刷新文件痕迹</button>
      <button id="export-csv" class="secondary" disabled>导出 CSV</button>
      <input id="filter" placeholder="按文件名、路径、来源过滤；支持 /正则/i、re:正则">
      <span id="status" class="status">尚未加载</span>
    </div>

    <div class="scopebar">
      <div class="scope-row">
        <label for="modified-roots">最近修改扫描目录</label>
        <textarea id="modified-roots" placeholder="默认扫描 Downloads、Desktop、AppData、ProgramData；也可输入 C:\、D:\ 或 C:\Windows，每行一个目录"></textarea>
        <button id="pick-modified-root" class="secondary">选择目录</button>
        <button id="clear-modified-roots" class="secondary">恢复默认</button>
        <span id="scope-note" class="status">默认扫描常见落地点</span>
      </div>
      <div class="scope-row">
        <label for="amcache-path">Amcache Hive</label>
        <input id="amcache-path" placeholder="留空读取本机 %SystemRoot%\AppCompat\Programs\Amcache.hve；也可选择离线 Hive">
        <button id="pick-amcache" class="secondary">选择 Hive</button>
        <button id="clear-amcache" class="secondary">使用本机默认</button>
        <span id="amcache-scope-note" class="status">当前读取本机默认 Hive</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all" data-label="全部">全部</button>
      <button class="tab" data-tab="suspicious" data-label="可疑项">可疑项</button>
      <button class="tab" data-tab="modified" data-label="最近修改">最近修改</button>
      <button class="tab" data-tab="run" data-label="最近运行">最近运行</button>
      <button class="tab" data-tab="artifacts" data-label="传统取证">传统取证</button>
	  <button class="tab" data-tab="structure" data-label="结构异常">结构异常</button>
      <button class="tab" data-tab="temp" data-label="Temp 文件">Temp 文件</button>
      <select id="artifact-source" title="按传统取证源筛选">
        <option value="">全部取证源</option>
        <option value="ntfs">MFT / USN</option>
        <option value="prefetch">Prefetch</option>
        <option value="amcache">Amcache</option>
        <option value="shimcache">Shimcache</option>
        <option value="srum">SRUM</option>
        <option value="lnk">LNK / JumpList</option>
        <option value="userassist">UserAssist / PCA</option>
        <option value="powershell">PowerShell 历史</option>
		<option value="native">Go 原生落地点</option>
		<option value="structure">敏感文件结构</option>
      </select>
    </div>

    <div id="summary" class="summary"></div>
    <div id="operation-notices" class="operation-notices" hidden></div>

    <section class="panel">
      <div id="amcache-note" class="evidence-note" hidden>Amcache 用于证明系统曾记录过文件及其元数据，不能单独证明文件已经执行。表中时间统一按“记录/扫描发现时间”解释；缓存 SHA1 不是当前文件的实时完整哈希，提交威胁情报前应再核验当前文件。</div>
      <div id="table" class="table-wrap">
        <div class="empty">正在加载文件痕迹...</div>
      </div>
    </section>
  </main>

  <script>
    const table = document.getElementById('table');
    const filter = document.getElementById('filter');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const noticesEl = document.getElementById('operation-notices');
    const exportCSV = document.getElementById('export-csv');
    const hoursEl = document.getElementById('hours');
    const maxRecords = document.getElementById('max-records');
    const modifiedRoots = document.getElementById('modified-roots');
    const pickModifiedRoot = document.getElementById('pick-modified-root');
    const clearModifiedRoots = document.getElementById('clear-modified-roots');
    const scopeNote = document.getElementById('scope-note');
    const artifactSource = document.getElementById('artifact-source');
    const amcachePath = document.getElementById('amcache-path');
    const pickAmcache = document.getElementById('pick-amcache');
    const clearAmcache = document.getElementById('clear-amcache');
    const amcacheScopeNote = document.getElementById('amcache-scope-note');
    const amcacheNote = document.getElementById('amcache-note');
    let records = [];
    let collectionErrors = [];
    let notices = [];
    let activeTab = 'all';
    let genericSort = { key: 'modified', direction: 'desc' };
    let amcacheSort = { key: 'evidenceTime', direction: 'desc' };

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeCell(value) {
      return text(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function isArtifactRecord(item) {
      return ['执行痕迹', '命令历史', 'NTFS 元数据', 'NTFS 变更痕迹', '网络与应用痕迹', '取证源状态', '文件结构异常'].includes(item.category)
        || item.source === 'Prefetch'
        || item.source === 'Recent 快捷方式';
    }

    function tabMatches(item) {
	  if (artifactSource.value === 'native') return true;
      if (activeTab === 'modified') return item.category === '最近修改文件';
      if (activeTab === 'run') return item.category === '最近运行文件';
      if (activeTab === 'artifacts') return isArtifactRecord(item);
	  if (activeTab === 'structure') return item.category === '文件结构异常';
      if (activeTab === 'temp') return item.category === 'Temp 临时文件';
      if (activeTab === 'suspicious') return !!item.suspicion;
      return true;
    }

    function sourceMatches(item) {
      const source = text(item.source).toLowerCase();
      if (!artifactSource.value) return true;
      if (artifactSource.value === 'ntfs') return source.includes('mft') || source.includes('usn');
      if (artifactSource.value === 'prefetch') return source.includes('prefetch');
      if (artifactSource.value === 'amcache') return source.includes('amcache');
      if (artifactSource.value === 'shimcache') return source.includes('shimcache');
      if (artifactSource.value === 'srum') return source.includes('srum');
      if (artifactSource.value === 'lnk') return source.includes('recent') || source.includes('jumplist');
      if (artifactSource.value === 'userassist') return source.includes('userassist') || source.includes('pca');
      if (artifactSource.value === 'powershell') return source.includes('powershell');
      if (artifactSource.value === 'native') return source.includes('go 原生落地点');
	  if (artifactSource.value === 'structure') return source.includes('敏感文件结构');
      return true;
    }

    function visibleItems() {
      const q = filter.value.trim();
      const items = records.filter(item => {
        if (!tabMatches(item)) return false;
        if (!sourceMatches(item)) return false;
        if (!q) return true;
        return window.wtlMatchesQuery(q, Object.values(item));
      });
      if (artifactSource.value !== 'amcache') return sortItems(items, genericSort, genericSortValue);
      return sortItems(items, amcacheSort, amcacheSortValue);
    }

    function sortItems(items, state, valueOf) {
      const direction = state.direction === 'asc' ? 1 : -1;
      return [...items].sort((a, b) => {
        const av = valueOf(a, state.key);
        const bv = valueOf(b, state.key);
        const aEmpty = av === '' || av == null;
        const bEmpty = bv === '' || bv == null;
        if (aEmpty && !bEmpty) return 1;
        if (!aEmpty && bEmpty) return -1;
        if (av < bv) return -1 * direction;
        if (av > bv) return 1 * direction;
        return text(a.name).localeCompare(text(b.name), 'zh-CN');
      });
    }

    function genericSortValue(item, key) {
      if (key === 'size') return item.size ? Number(item.size) : '';
	  if (key === 'entropy') return Number(item.entropy || 0);
      if (key === 'suspicion') return ({ '高': 3, '中': 2, '低': 1 }[item.suspicion] || 0);
      return text(item[key]).toLowerCase();
    }

    function amcacheSortValue(item, key) {
      if (key === 'size') return Number(item.size || 0);
      if (key === 'suspicion') return ({ '高': 3, '中': 2, '低': 1 }[item.suspicion] || 0);
      return text(item[key]).toLowerCase();
    }

    function amcacheHeader(label, key, className) {
      const active = amcacheSort.key === key;
      const mark = active ? (amcacheSort.direction === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th class="${className || ''} sortable" data-amcache-sort="${key}" title="单击按${escapeCell(label)}排序">${escapeCell(label)}<span class="sort-mark">${mark}</span></th>`;
    }

    function genericHeader(label, key, className) {
      const active = genericSort.key === key;
      const mark = active ? (genericSort.direction === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th class="${className || ''} sortable" data-generic-sort="${key}" title="单击按${escapeCell(label)}排序">${escapeCell(label)}<span class="sort-mark">${mark}</span></th>`;
    }

    function countFor(tab) {
      const previous = activeTab;
      activeTab = tab;
      const count = records.filter(tabMatches).length;
      activeTab = previous;
      return count;
    }

    function updateTabs() {
      document.querySelectorAll('button.tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
        btn.textContent = `${btn.dataset.label} ${countFor(btn.dataset.tab)}`;
      });
    }

    function riskBadge(value) {
      if (value === '高') return '<span class="badge bad">高</span>';
      if (value === '中') return '<span class="badge warn">中</span>';
      if (value === '低') return '<span class="badge info">低</span>';
      return '<span class="badge ok">-</span>';
    }

    function rowClass(item) {
      if (item.suspicion === '高') return 'high';
      if (item.suspicion === '中') return 'medium';
      return '';
    }

    function formatSize(value) {
      const n = Number(value || 0);
      if (!n) return '';
      if (n >= 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${n} B`;
    }

    function splitRoots(value) {
      return text(value)
        .split(/[\r\n;]+/)
        .map(x => x.trim().replace(/^['"]|['"]$/g, ''))
        .filter(Boolean)
        .filter((x, index, arr) => arr.findIndex(y => y.toLowerCase() === x.toLowerCase()) === index)
        .slice(0, 8);
    }

    function setRoots(roots) {
      modifiedRoots.value = roots.join('\n');
      updateScopeNote();
    }

    function updateScopeNote() {
      const roots = splitRoots(modifiedRoots.value);
      scopeNote.textContent = roots.length
        ? `已选择 ${roots.length} 个目录：${roots.join('；')}`
        : '默认扫描常见落地点';
    }

    function renderSummary() {
      const modified = records.filter(x => x.category === '最近修改文件').length;
      const run = records.filter(x => x.category === '最近运行文件').length;
      const temp = records.filter(x => x.category === 'Temp 临时文件').length;
      const artifacts = records.filter(isArtifactRecord).length;
      const usn = records.filter(x => x.source === 'USN Journal').length;
      const amcache = records.filter(x => x.source === 'Amcache Hive').length;
      const prefetch = records.filter(x => x.source === 'Prefetch').length;
      const powershell = records.filter(x => x.source === 'PowerShell PSReadLine').length;
	  const nativeLanding = records.filter(x => x.source === 'Go 原生落地点扫描').length;
	  const structures = records.filter(x => x.source === '敏感文件结构校验').length;
      const suspicious = records.filter(x => x.suspicion).length;
      const errors = collectionErrors.map(x => `<span class="bad" title="${escapeCell(x)}">${escapeCell(x)}</span>`).join('');
      summaryEl.innerHTML = [
        `<span class="badge info">总数 ${records.length}</span>`,
        `<span class="badge warn">可疑 ${suspicious}</span>`,
        `<span class="badge info">最近修改 ${modified}</span>`,
        `<span class="badge info">最近运行 ${run}</span>`,
        `<span class="badge info">执行痕迹 ${artifacts}</span>`,
        `<span class="badge info">Prefetch ${prefetch}</span>`,
        `<span class="badge info">PowerShell 历史 ${powershell}</span>`,
		`<span class="badge warn">原生落地点 ${nativeLanding}</span>`,
		`<span class="badge warn">结构异常 ${structures}</span>`,
        `<span class="badge info">USN ${usn}</span>`,
        `<span class="badge info">Amcache ${amcache}</span>`,
        `<span class="badge info">Temp ${temp}</span>`,
        errors
      ].join('');
      noticesEl.hidden = notices.length === 0;
      noticesEl.innerHTML = notices.map(x => `<div>${escapeCell(x)}</div>`).join('');
    }

    function renderGenericTable(items) {
      table.innerHTML = `<table style="min-width: 3400px">
        <thead><tr>
          ${genericHeader('分类', 'category', 'category')}${genericHeader('来源', 'source', 'source')}${genericHeader('可疑', 'suspicion', 'risk')}${genericHeader('文件名', 'name', 'name')}
          ${genericHeader('修改时间', 'modified', 'time')}${genericHeader('最近运行', 'lastRun', 'time')}${genericHeader('创建时间', 'created', 'time')}${genericHeader('大小', 'size', 'size')}
		  ${genericHeader('Magic', 'magic', 'source')}${genericHeader('熵', 'entropy', 'size')}${genericHeader('文件属性', 'attributes', 'attributes')}${genericHeader('签名', 'signature', 'signature')}
		  ${genericHeader('SHA-256', 'sha256', 'hash')}${genericHeader('关联服务', 'relatedServices', 'association')}${genericHeader('路径', 'path', 'path')}${genericHeader('原因', 'reason', 'reason')}${genericHeader('详情', 'details', 'details')}
        </tr></thead>
        <tbody>${items.map(item => `<tr class="${rowClass(item)}">
          <td class="category" title="${escapeCell(item.category)}">${escapeCell(item.category)}</td>
          <td class="source" title="${escapeCell(item.source)}">${escapeCell(item.source)}</td>
          <td class="risk">${riskBadge(item.suspicion)}</td>
          <td class="name" title="${escapeCell(item.name)}">${escapeCell(item.name)}</td>
          <td class="time" title="${escapeCell(item.modified)}">${escapeCell(item.modified)}</td>
          <td class="time" title="${escapeCell(item.lastRun)}">${escapeCell(item.lastRun)}</td>
          <td class="time" title="${escapeCell(item.created)}">${escapeCell(item.created)}</td>
          <td class="size" title="${escapeCell(item.size)}">${escapeCell(formatSize(item.size))}</td>
		  <td class="source" title="${escapeCell(item.magic)}">${escapeCell(item.magic)}</td>
		  <td class="size" title="${escapeCell(item.entropy)}">${escapeCell(item.entropy ? Number(item.entropy).toFixed(2) : '')}</td>
		  <td class="attributes" title="${escapeCell(item.attributes)}">${escapeCell(item.attributes)}</td>
		  <td class="signature" title="${escapeCell(item.signatureMsg)}">${escapeCell(item.signature)}</td>
		  <td class="hash" title="${escapeCell(item.sha256)}">${escapeCell(item.sha256)}</td>
		  <td class="association" title="${escapeCell((item.relatedServices || []).join('；'))}">${escapeCell((item.relatedServices || []).join('；'))}</td>
          <td class="path" title="${escapeCell(item.path)}">${escapeCell(item.path)}</td>
          <td class="reason" title="${escapeCell(item.reason)}">${escapeCell(item.reason)}</td>
          <td class="details" title="${escapeCell(item.details)}">${escapeCell(item.details)}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function renderAmcacheTable(items) {
      table.innerHTML = `<table style="min-width: 3000px">
        <thead><tr>
          ${amcacheHeader('风险', 'suspicion', 'risk')}${amcacheHeader('Schema', 'schema', 'schema')}${amcacheHeader('文件名', 'name', 'name')}
          ${amcacheHeader('SHA1', 'sha1', 'hash')}${amcacheHeader('Publisher', 'publisher', 'publisher')}${amcacheHeader('产品', 'productName', 'product')}
          ${amcacheHeader('产品版本', 'productVersion', 'product')}${amcacheHeader('BinaryType', 'binaryType', 'source')}${amcacheHeader('应用关联', 'association', 'association')}
          ${amcacheHeader('ProgramId', 'programId', 'hash')}${amcacheHeader('记录/扫描发现时间', 'evidenceTime', 'time')}${amcacheHeader('PE 链接时间', 'linkDate', 'time')}
          ${amcacheHeader('当前签名', 'signature', 'source')}${amcacheHeader('大小', 'size', 'size')}${amcacheHeader('路径', 'path', 'path')}
          ${amcacheHeader('原因', 'reason', 'reason')}<th class="details">详情/时间语义</th>
        </tr></thead>
        <tbody>${items.map(item => `<tr class="${rowClass(item)}">
          <td class="risk">${riskBadge(item.suspicion)}</td>
          <td class="schema">${escapeCell(item.schema)}</td>
          <td class="name" title="${escapeCell(item.name)}">${escapeCell(item.name)}</td>
          <td class="hash" title="${escapeCell(item.sha1)}">${escapeCell(item.sha1)}</td>
          <td class="publisher" title="${escapeCell(item.publisher)}">${escapeCell(item.publisher)}</td>
          <td class="product" title="${escapeCell(item.productName)}">${escapeCell(item.productName)}</td>
          <td class="product" title="${escapeCell(item.productVersion)}">${escapeCell(item.productVersion)}</td>
          <td class="source" title="${escapeCell(item.binaryType)}">${escapeCell(item.binaryType)}</td>
          <td class="association" title="${escapeCell(item.association)}">${escapeCell(item.association)}</td>
          <td class="hash" title="${escapeCell(item.programId)}">${escapeCell(item.programId)}</td>
          <td class="time" title="${escapeCell(item.timeMeaning)}">${escapeCell(item.evidenceTime)}</td>
          <td class="time" title="${escapeCell(item.linkDate)}">${escapeCell(item.linkDate)}</td>
          <td class="source" title="${escapeCell(item.signatureMsg)}">${escapeCell(item.signature)}</td>
          <td class="size" title="${escapeCell(item.size)}">${escapeCell(formatSize(item.size))}</td>
          <td class="path" title="${escapeCell(item.path)}">${escapeCell(item.path)}</td>
          <td class="reason" title="${escapeCell(item.reason)}">${escapeCell(item.reason)}</td>
          <td class="details" title="${escapeCell([item.details, item.timeMeaning, item.signatureMsg].filter(Boolean).join('；'))}">${escapeCell([item.details, item.timeMeaning, item.signatureMsg].filter(Boolean).join('；'))}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function renderContent() {
      updateTabs();
      renderSummary();
      amcacheNote.hidden = artifactSource.value !== 'amcache';
      const items = visibleItems();
      const tabTotal = records.filter(tabMatches).length;
      statusEl.textContent = `显示 ${items.length} / ${tabTotal}`;
      if (!items.length) {
        table.innerHTML = '<div class="empty">没有匹配的文件痕迹</div>';
        return;
      }
      if (artifactSource.value === 'amcache') renderAmcacheTable(items);
      else renderGenericTable(items);
    }

    function render() {
      try {
        renderContent();
      } catch (err) {
        table.innerHTML = `<div class="empty bad">${escapeCell(err.message || err)}</div>`;
        statusEl.textContent = '搜索条件无效';
      }
    }

    async function loadJSON(url, options) {
      const res = await fetch(url, options || { cache: 'no-store' });
      if (!res.ok) throw new Error(await res.text() || res.statusText);
      return res.json();
    }

    async function chooseFolder(title) {
      const params = new URLSearchParams({ title });
      const data = await loadJSON(`/api/dialog/folder?${params}`);
      if (data.error) throw new Error(data.error);
      return data.ok ? data.path : '';
    }

    async function chooseFile(title) {
      const params = new URLSearchParams({ title });
      const data = await loadJSON(`/api/dialog/file?${params}`);
      if (data.error) throw new Error(data.error);
      return data.ok ? data.path : '';
    }

    function queryString(includeFilter, refresh) {
      const params = new URLSearchParams({
        max: maxRecords.value || '500',
        hours: hoursEl.value || '72',
        category: artifactSource.value === 'native' ? 'all' : activeTab
      });
      splitRoots(modifiedRoots.value).forEach(root => params.append('root', root));
      if (amcachePath.value.trim()) params.set('amcache_path', amcachePath.value.trim());
      const q = filter.value.trim();
      if (includeFilter && q) params.set('q', q);
	  if (includeFilter && artifactSource.value) params.set('source', artifactSource.value);
      if (refresh) params.set('refresh', '1');
      return params.toString();
    }

    function downloadCSV(url) {
      window.wtlDownload(url).catch(err => {
        statusEl.textContent = `导出失败：${err.message || err}`;
      });
    }

    async function load(refresh = false) {
      statusEl.textContent = '正在采集文件痕迹...';
      exportCSV.disabled = true;
      summaryEl.innerHTML = '';
      notices = [];
      noticesEl.hidden = true;
      noticesEl.innerHTML = '';
      const roots = splitRoots(modifiedRoots.value);
      table.innerHTML = roots.length
        ? `<div class="empty">正在扫描自定义目录，并采集 MFT/USN、Prefetch、Amcache、Shimcache、SRUM、LNK/JumpList、UserAssist 和 PowerShell 历史...</div>`
        : '<div class="empty">正在采集 MFT/USN、Prefetch、Amcache、Shimcache、SRUM、LNK/JumpList、UserAssist 和 PowerShell 历史...</div>';
      const params = new URLSearchParams(queryString(false, refresh));
	  params.set('category', 'all');
	  const data = await loadJSON(`/api/files/traces?${params}`);
      records = data.records || [];
      collectionErrors = data.collectionErrors || [];
      notices = data.notices || [];
      exportCSV.disabled = false;
      statusEl.textContent = `生成时间 ${data.generatedAt || ''}，记录 ${records.length}`;
      render();
    }

    document.getElementById('refresh').addEventListener('click', () => {
      load(true).catch(err => {
        table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    pickModifiedRoot.addEventListener('click', async () => {
      try {
        const path = await chooseFolder('选择最近修改文件扫描目录');
        if (!path) return;
        const roots = splitRoots(modifiedRoots.value);
        if (!roots.some(root => root.toLowerCase() === path.toLowerCase())) {
          roots.push(path);
        }
        setRoots(roots);
        activeTab = 'modified';
        await load();
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });

    clearModifiedRoots.addEventListener('click', () => {
      setRoots([]);
      load().catch(err => {
        table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    modifiedRoots.addEventListener('input', updateScopeNote);
    amcachePath.addEventListener('input', updateAmcacheScopeNote);
    pickAmcache.addEventListener('click', async () => {
      try {
        const path = await chooseFile('选择离线 Amcache.hve');
        if (!path) return;
        amcachePath.value = path;
        updateAmcacheScopeNote();
        activeTab = 'artifacts';
        artifactSource.value = 'amcache';
        await load(true);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    });
    clearAmcache.addEventListener('click', () => {
      amcachePath.value = '';
      updateAmcacheScopeNote();
      load(true).catch(err => {
        table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });
    exportCSV.addEventListener('click', () => {
      statusEl.textContent = '正在生成 CSV...';
      downloadCSV(`/api/files/traces.csv?${queryString(true, false)}`);
    });

    document.querySelectorAll('button.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        if (activeTab !== 'artifacts') artifactSource.value = '';
        render();
      });
    });
    filter.addEventListener('input', render);
    artifactSource.addEventListener('change', () => {
	  if (artifactSource.value === 'native') activeTab = 'all';
	  else if (artifactSource.value) activeTab = 'artifacts';
      render();
    });
    table.addEventListener('click', event => {
      const amcacheHeader = event.target.closest('[data-amcache-sort]');
      if (amcacheHeader) {
        const key = amcacheHeader.dataset.amcacheSort;
        if (amcacheSort.key === key) amcacheSort.direction = amcacheSort.direction === 'asc' ? 'desc' : 'asc';
        else amcacheSort = { key, direction: key === 'name' || key === 'publisher' ? 'asc' : 'desc' };
        render();
        return;
      }
      const genericHeader = event.target.closest('[data-generic-sort]');
      if (!genericHeader) return;
      const key = genericHeader.dataset.genericSort;
      if (genericSort.key === key) genericSort.direction = genericSort.direction === 'asc' ? 'desc' : 'asc';
      else genericSort = { key, direction: ['category', 'source', 'name', 'path', 'reason', 'details'].includes(key) ? 'asc' : 'desc' };
      render();
    });
    hoursEl.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    maxRecords.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));

    function updateAmcacheScopeNote() {
      amcacheScopeNote.textContent = amcachePath.value.trim()
        ? `离线 Hive：${amcachePath.value.trim()}`
        : '当前读取本机默认 Hive';
    }

    updateScopeNote();
    updateAmcacheScopeNote();
    load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    });
  </script>
</body>
</html>
