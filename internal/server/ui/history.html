<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinTraceLens - 历史通信记录</title>
  <script src="/theme-init.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --line-soft: #edf1f6;
      --text: #182235;
      --muted: #5b6678;
      --head: #243447;
      --head-2: #edf3f8;
      --accent: #1769aa;
      --accent-dark: #0f4e82;
      --bad: #a41220;
      --warn: #9a5200;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 18px;
      background: var(--head);
      color: #fff;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 10px;
      height: calc(100vh - 48px);
      padding: 12px;
    }
    .toolbar, .tabs, .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input, select {
      width: min(560px, 100%);
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    input.date-input {
      width: 148px;
      min-width: 148px;
      flex: 0 0 148px;
    }
    select.limit-select {
      width: 132px;
      min-width: 132px;
      flex: 0 0 132px;
    }
    .range-label {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    button, a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent-dark);
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }
    button.secondary, a.button.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }
    button.tab.active {
      border-color: var(--accent);
      background: #e8f2fb;
      color: var(--accent-dark);
    }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    .status {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
    }
    .meta {
      min-height: 34px;
      color: var(--muted);
    }
    .error {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border: 1px solid #f0ce9f;
      border-radius: 999px;
      background: #fff7e8;
      color: var(--warn);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .tag.warn {
      border-color: #f0ce9f;
      background: #fff7e8;
      color: var(--warn);
    }
    .tag.info {
      border-color: #c7d7ee;
      background: #eef5fd;
      color: #2b5b91;
    }
    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }
    .table-wrap {
      height: 100%;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1720px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.dns-table { min-width: 680px; }
    table.monitor-table { min-width: 1130px; }
    table.all-evidence-table { min-width: 1080px; }
    .dns-table .source { width: 130px; }
    .dns-table .query { width: 330px; }
    .dns-table .details { width: 420px; }
    .monitor-table .seen { width: 132px; }
    .monitor-table .process { width: 160px; }
    .monitor-table .pid { width: 60px; }
    .monitor-table .state { width: 130px; }
    .monitor-table .endpoint { width: 185px; }
    .monitor-table .number { width: 90px; text-align: right; }
    .monitor-table .active { width: 58px; }
    .all-evidence-table .time { width: 150px; }
    .all-evidence-table .source { width: 120px; }
    .all-evidence-table .process { width: 190px; }
    .all-evidence-table .pid { width: 70px; }
    .all-evidence-table .target { width: 260px; }
    .all-evidence-table .state { width: 150px; }
    .all-evidence-table .details { width: 300px; }
    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head-2);
      color: #26384f;
      font-weight: 650;
    }
    tbody tr:hover td { background: #f3f8ff; }
    tbody tr.syn-row td { background: rgba(190, 111, 8, 0.10); }
    tbody tr.syn-row:hover td { background: rgba(190, 111, 8, 0.16); }
    .time { width: 160px; }
    .source { width: 120px; }
    .event { width: 82px; }
    .process { width: 280px; }
    .pid { width: 80px; }
    .proto { width: 82px; }
    .endpoint { width: 230px; }
    .query { width: 260px; }
    .action { width: 90px; }
    .user { width: 170px; }
    .details { width: 340px; }
    .empty { padding: 18px; color: var(--muted); }
    .bad { color: var(--bad); }
  </style>
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/tables.css">
  <script src="/app.js"></script>
  <script src="/ui-preferences.js" defer></script>
</head>
<body>
  <header>
    <h1>WinTraceLens</h1>
    <div class="app-meta">
      <span class="release-badge" data-app-version>1.0 基础版</span>
      <span class="permission-badge unknown" data-admin-status>权限检测中</span>
      <span class="module-title">历史通信记录</span>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <nav class="top-nav" aria-label="主要功能">
        <a class="nav-link" href="/">进程信息</a>
        <a class="nav-link" href="/host.html">主机信息</a>
        <a class="nav-link" href="/findings.html">风险线索</a>
        <a class="nav-link" href="/threat.html">威胁分析</a>
        <a class="nav-link" href="/investigation.html">案件调查</a>
        <a class="nav-link" href="/filetrace.html">文件痕迹</a>
        <a class="nav-link" aria-current="page" href="/history.html">历史通信</a>
        <a class="nav-link" href="/security.html">事件日志</a>
        <a class="nav-link" href="/yara.html">YARA扫描</a>
        <a class="nav-link" href="/ai.html">AI分析</a>
      </nav>
      <span class="current-module">当前：历史通信</span>
      <span class="range-label">日志时间</span>
      <input id="start-date" class="date-input" type="date" title="开始日期">
      <span class="range-label">至</span>
      <input id="end-date" class="date-input" type="date" title="结束日期">
      <select id="max-records" class="limit-select" title="每个历史来源最多保留条数">
        <option value="500">每源 500</option>
        <option value="1000" selected>每源 1000</option>
        <option value="2000">每源 2000</option>
        <option value="5000">每源 5000</option>
      </select>
      <button id="refresh">刷新历史记录</button>
      <button id="export-csv" class="secondary" disabled>导出 CSV</button>
      <input id="filter" placeholder="按来源、进程、PID、IP、域名过滤；支持 www.*.com、/正则/i">
      <span id="status" class="status">尚未加载</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="connections" data-label="连接历史">连接历史</button>
      <button class="tab" data-tab="dns" data-label="DNS 记录">DNS 记录</button>
      <button class="tab" data-tab="live" data-label="当前连接">当前连接</button>
      <button class="tab" data-tab="monitor" data-label="短连接监测">短连接监测</button>
      <button class="tab" data-tab="all" data-label="全部证据">全部证据</button>
    </div>
    <div id="meta" class="meta"></div>
    <section class="panel">
      <div id="table" class="table-wrap">
        <div class="empty">正在加载历史通信记录...</div>
      </div>
    </section>
  </main>

  <script>
    const table = document.getElementById('table');
    const filter = document.getElementById('filter');
    const statusEl = document.getElementById('status');
    const meta = document.getElementById('meta');
    const exportCSV = document.getElementById('export-csv');
    const startDate = document.getElementById('start-date');
    const endDate = document.getElementById('end-date');
    const maxRecords = document.getElementById('max-records');
    let records = [];
    let liveRecords = [];
    let monitorRecords = [];
    let monitorInfo = {};
    let liveGeneratedAt = '';
    let monitorTimer = null;
    let collectionErrors = [];
    let activeTab = 'connections';

    function text(value) {
      return value == null ? '' : String(value);
    }

    function escapeCell(value) {
      return text(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function visibleItems() {
      if (activeTab === 'live') {
        return visibleLiveItems();
      }
      if (activeTab === 'monitor') {
        return visibleMonitorItems();
      }
      const tabItems = recordsForTab(activeTab);
      const q = filter.value.trim();
      if (!q) return tabItems;
      return tabItems.filter(item => queryMatches(item, q));
    }

    function visibleLiveItems() {
      const q = filter.value.trim();
      if (!q) return liveRecords;
      return liveRecords.filter(item => queryMatches(item, q));
    }

    function visibleMonitorItems() {
      const q = filter.value.trim();
      if (!q) return monitorRecords;
      return monitorRecords.filter(item => queryMatches(item, q));
    }

    function queryMatches(item, q) {
      const values = Object.values(item);
      if (window.wtlLooksLikeRegex(q)) return window.wtlMatchesQuery(q, values);
      return q.split(/\s+/).filter(Boolean).every(part => window.wtlMatchesQuery(part, values));
    }

    function isConnectionRecord(item) {
      return ['Sysmon', '安全日志 WFP', '防火墙日志'].includes(item.source);
    }

    function isDNSRecord(item) {
      return ['DNS 缓存', 'Sysmon DNS', 'DNS Client 日志'].includes(item.source);
    }

    function normalizeLiveRecord(item) {
      return {
        time: item.observedAt || liveGeneratedAt,
        source: '当前快照',
        eventId: '',
        process: item.process,
        pid: item.pid,
        proto: item.protocol,
        local: item.local,
        remote: item.remote,
        query: '',
        action: [item.remoteKind, item.state].filter(Boolean).join(' / '),
        user: '',
        details: item.path
      };
    }

    function normalizeMonitorRecord(item) {
      const state = [item.remoteKind, item.state].filter(Boolean).join(' / ');
      const activity = `出现 ${item.occurrences || 0} 次，采样 ${item.samples || 0} 次${item.currentlyActive ? '，当前存在' : ''}`;
      return {
        time: item.lastSeen,
        source: '短连接监测',
        eventId: '',
        process: item.process,
        pid: item.pid,
        proto: item.protocol,
        local: item.local,
        remote: item.remote,
        query: '',
        action: state,
        user: '',
        details: [`首次 ${item.firstSeen}`, activity, item.path].filter(Boolean).join('；')
      };
    }

    function tabMatches(item, tab = activeTab) {
      if (tab === 'connections') return isConnectionRecord(item);
      if (tab === 'dns') return isDNSRecord(item);
      if (tab === 'live') return false;
      if (tab === 'monitor') return false;
      return true;
    }

    function recordsForTab(tab) {
      if (tab === 'all') return [...records, ...monitorRecords.map(normalizeMonitorRecord)];
      return records.filter(item => tabMatches(item, tab));
    }

    function tabCount(tab) {
      if (tab === 'live') return liveRecords.length;
      if (tab === 'monitor') return monitorRecords.length;
      return recordsForTab(tab).length;
    }

    function updateTabs() {
      document.querySelectorAll('button.tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
        btn.textContent = `${btn.dataset.label} ${tabCount(btn.dataset.tab)}`;
      });
    }

    function renderMeta(items) {
      const sourceItems = activeTab === 'live'
        ? items.map(normalizeLiveRecord)
        : activeTab === 'monitor' ? items.map(normalizeMonitorRecord) : items;
      const sources = [...new Set(sourceItems.map(x => x.source).filter(Boolean))];
      const connectionCount = records.filter(isConnectionRecord).length;
      const dnsCount = records.filter(isDNSRecord).length;
      const externalCount = liveRecords.filter(x => x.remoteKind === '公网/外部').length;
      const synCount = monitorRecords.filter(x => /SYN/i.test(text(x.state))).length;
      const errors = collectionErrors.map(x => `<span class="error" title="${escapeCell(x)}">${escapeCell(x)}</span>`).join('');
      const monitorError = monitorInfo.lastError ? `<span class="error" title="${escapeCell(monitorInfo.lastError)}">短连接监测: ${escapeCell(monitorInfo.lastError)}</span>` : '';
      meta.innerHTML = `<span>当前来源 ${sources.length}: ${escapeCell(sources.join(' / ') || '无')}</span><span class="tag info">连接历史 ${connectionCount}</span><span class="tag info">DNS 记录 ${dnsCount}</span><span class="tag ${externalCount ? 'warn' : ''}">当前公网连接 ${externalCount}</span><span class="tag info">短连接 ${monitorRecords.length}</span><span class="tag ${synCount ? 'warn' : ''}">SYN 线索 ${synCount}</span>${errors}${monitorError}`;
    }

    function render() {
      const items = visibleItems();
      updateTabs();
      renderMeta(items);
      const tabTotal = tabCount(activeTab);
      const activeLabel = document.querySelector(`button.tab[data-tab="${activeTab}"]`)?.dataset.label || '历史记录';
      statusEl.textContent = `${activeLabel} ${items.length} / ${activeTab === 'live' ? liveRecords.length : tabTotal}`;
      if (activeTab === 'live') {
        renderLive(items);
        return;
      }
      if (activeTab === 'monitor') {
        renderMonitor(items);
        return;
      }
      if (!items.length) {
        if (activeTab === 'connections') {
          table.innerHTML = '<div class="empty">当前没有连接历史记录。Windows 默认不保存完整历史连接；需要启用 Sysmon 网络事件、Windows Filtering Platform 连接审计，或 Windows 防火墙日志后才会有连接级历史记录。DNS 证据请切换到“DNS 记录”页签查看。</div>';
        } else if (activeTab === 'dns') {
          table.innerHTML = '<div class="empty">当前没有 DNS 记录。DNS 缓存没有时间和发起进程；如需定位日期和进程，建议启用 Sysmon DNS 事件 22 或 DNS Client Operational 日志。</div>';
        } else {
          table.innerHTML = '<div class="empty">没有匹配的历史网络证据</div>';
        }
        return;
      }
      if (activeTab === 'dns') {
        renderDNS(items);
        return;
      }
      if (activeTab === 'all') {
        renderAll(items);
        return;
      }
      table.innerHTML = `<table><thead><tr>
        <th class="time">时间</th><th class="source">来源</th><th class="event">事件ID</th><th class="process">进程</th><th class="pid">PID</th>
        <th class="proto">协议</th><th class="endpoint">本地地址</th><th class="endpoint">远程地址</th><th class="query">DNS 查询</th>
        <th class="action">动作</th><th class="user">用户</th><th class="details">详情</th>
      </tr></thead><tbody>${items.map(x => `<tr>
        <td class="time" title="${escapeCell(x.time)}">${escapeCell(x.time)}</td>
        <td class="source" title="${escapeCell(x.source)}">${escapeCell(x.source)}</td>
        <td class="event" title="${escapeCell(x.eventId)}">${escapeCell(x.eventId)}</td>
        <td class="process" title="${escapeCell(x.process)}">${escapeCell(x.process)}</td>
        <td class="pid" title="${escapeCell(x.pid)}">${escapeCell(x.pid)}</td>
        <td class="proto" title="${escapeCell(x.proto)}">${escapeCell(x.proto)}</td>
        <td class="endpoint" title="${escapeCell(x.local)}">${escapeCell(x.local)}</td>
        <td class="endpoint" title="${escapeCell(x.remote)}">${escapeCell(x.remote)}</td>
        <td class="query" title="${escapeCell(x.query)}">${escapeCell(x.query)}</td>
        <td class="action" title="${escapeCell(x.action)}">${escapeCell(x.action)}</td>
        <td class="user" title="${escapeCell(x.user)}">${escapeCell(x.user)}</td>
        <td class="details" title="${escapeCell(x.details)}">${escapeCell(x.details)}</td>
      </tr>`).join('')}</tbody></table>`;
    }

    function renderDNS(items) {
      table.innerHTML = `<table class="dns-table"><thead><tr>
        <th class="source">来源</th><th class="query">DNS 查询</th><th class="details">详情</th>
      </tr></thead><tbody>${items.map(x => `<tr>
        <td class="source" title="${escapeCell(x.source)}">${escapeCell(x.source)}</td>
        <td class="query" title="${escapeCell(x.query)}">${escapeCell(x.query)}</td>
        <td class="details" title="${escapeCell(x.details)}">${escapeCell(x.details)}</td>
      </tr>`).join('')}</tbody></table>`;
    }

    function renderAll(items) {
      table.innerHTML = `<table class="all-evidence-table"><thead><tr>
        <th class="time">时间</th><th class="source">来源</th><th class="process">进程</th><th class="pid">PID</th>
        <th class="target">通信目标</th><th class="state">协议/状态</th><th class="details">详情</th>
      </tr></thead><tbody>${items.map(x => {
        const target = x.query || x.remote || x.local || '';
        const state = [x.proto, x.action].filter(Boolean).join(' / ');
        const endpointContext = x.query ? '' : [x.local && `本地 ${x.local}`, x.remote && `远程 ${x.remote}`].filter(Boolean).join('；');
        const details = [x.details, endpointContext].filter(Boolean).join('；');
        return `<tr>
          <td class="time" title="${escapeCell(x.time)}">${escapeCell(x.time)}</td>
          <td class="source" title="${escapeCell(x.source)}">${escapeCell(x.source)}</td>
          <td class="process" title="${escapeCell(x.process)}">${escapeCell(x.process)}</td>
          <td class="pid" title="${escapeCell(x.pid)}">${escapeCell(x.pid)}</td>
          <td class="target" title="${escapeCell(target)}">${escapeCell(target)}</td>
          <td class="state" title="${escapeCell(state)}">${escapeCell(state)}</td>
          <td class="details" title="${escapeCell(details)}">${escapeCell(details)}</td>
        </tr>`;
      }).join('')}</tbody></table>`;
    }

    function renderLive(items) {
      if (!items.length) {
        table.innerHTML = '<div class="empty">当前快照没有匹配的网络连接。请切换到“短连接监测”查看本次程序运行期间曾短暂出现的外联和 SYN-SENT 线索。</div>';
        return;
      }
      table.innerHTML = `<table><thead><tr>
        <th class="time">采集时间</th><th class="source">来源</th><th class="process">进程</th><th class="pid">PID</th>
        <th class="proto">协议</th><th class="endpoint">本地地址</th><th class="endpoint">远程地址</th>
        <th class="action">远程类型</th><th class="action">状态</th><th class="details">路径</th>
      </tr></thead><tbody>${items.map(x => `<tr>
        <td class="time" title="${escapeCell(x.observedAt || liveGeneratedAt)}">${escapeCell(x.observedAt || liveGeneratedAt)}</td>
        <td class="source">当前快照</td>
        <td class="process" title="${escapeCell(x.process)}">${escapeCell(x.process)}</td>
        <td class="pid" title="${escapeCell(x.pid)}">${escapeCell(x.pid)}</td>
        <td class="proto" title="${escapeCell(x.protocol)}">${escapeCell(x.protocol)}</td>
        <td class="endpoint" title="${escapeCell(x.local)}">${escapeCell(x.local)}</td>
        <td class="endpoint" title="${escapeCell(x.remote)}">${escapeCell(x.remote)}</td>
        <td class="action" title="${escapeCell(x.remoteKind)}">${escapeCell(x.remoteKind)}</td>
        <td class="action" title="${escapeCell(x.state)}">${escapeCell(x.state)}</td>
        <td class="details" title="${escapeCell(x.path)}">${escapeCell(x.path)}</td>
      </tr>`).join('')}</tbody></table>`;
    }

    function renderMonitor(items) {
      if (!items.length) {
        table.innerHTML = '<div class="empty">程序启动后尚未监测到匹配的短连接。监测器每秒采样一次，结果仅在本次运行期间保留。</div>';
        return;
      }
      table.innerHTML = `<table class="monitor-table"><thead><tr>
        <th class="seen">首次发现</th><th class="seen">最后发现</th><th class="process">进程</th><th class="pid">PID</th>
        <th class="state">协议 / 最后状态</th><th class="endpoint">本地地址</th><th class="endpoint">远程地址</th>
        <th class="number">出现 / 采样</th><th class="active">当前</th>
      </tr></thead><tbody>${items.map(x => `<tr class="${/SYN/i.test(text(x.state)) ? 'syn-row' : ''}">
        <td class="seen" title="${escapeCell(x.firstSeen)}">${escapeCell(x.firstSeen)}</td>
        <td class="seen" title="${escapeCell(x.lastSeen)}">${escapeCell(x.lastSeen)}</td>
        <td class="process" title="${escapeCell([x.process, x.path].filter(Boolean).join(' / '))}">${escapeCell(x.process)}</td>
        <td class="pid" title="${escapeCell(x.pid)}">${escapeCell(x.pid)}</td>
        <td class="state" title="${escapeCell([x.protocol, x.state].filter(Boolean).join(' / '))}">${escapeCell([x.protocol, x.state].filter(Boolean).join(' / '))}</td>
        <td class="endpoint" title="${escapeCell(x.local)}">${escapeCell(x.local)}</td>
        <td class="endpoint" title="${escapeCell([x.remote, x.remoteKind].filter(Boolean).join(' / '))}">${escapeCell(x.remote)}</td>
        <td class="number" title="连接消失后再次出现会增加出现次数；采样表示连接表命中次数">${escapeCell(x.occurrences)} / ${escapeCell(x.samples)}</td>
        <td class="active">${x.currentlyActive ? '是' : '否'}</td>
      </tr>`).join('')}</tbody></table>`;
    }

    async function loadJSON(url, options) {
      const res = await fetch(url, options || { cache: 'no-store' });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || res.statusText);
      }
      return res.json();
    }

    function downloadCSV(url) {
      window.wtlDownload(url).catch(err => {
        statusEl.textContent = `导出失败：${err.message || err}`;
      });
    }

    function csvCell(value) {
      let normalized = text(value).replace(/\0/g, ' ').replace(/\r?\n/g, ' ');
      if (/^[=+\-@]/.test(normalized.trimStart())) normalized = `'${normalized}`;
      return `"${normalized.replace(/"/g, '""')}"`;
    }

    function exportAllCSV() {
      const header = ['时间', '来源', '事件ID', '进程', 'PID', '协议', '本地地址', '远程地址', 'DNS 查询', '动作/状态', '用户', '详情/路径'];
      const rows = visibleItems().map(item => [item.time, item.source, item.eventId, item.process, item.pid, item.proto, item.local, item.remote, item.query, item.action, item.user, item.details]);
      const csv = [header, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob(['\ufeff', csv], { type: 'text/csv;charset=utf-8' }));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `network-all-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function queryString() {
      if (activeTab === 'live' || activeTab === 'monitor') {
        const params = new URLSearchParams();
        const q = filter.value.trim();
        if (q) params.set('q', q);
        return params.toString();
      }
      const params = new URLSearchParams({ max: maxRecords.value || '1000', category: activeTab });
      const q = filter.value.trim();
      if (q) params.set('q', q);
      if (startDate.value) params.set('start', startDate.value);
      if (endDate.value) params.set('end', endDate.value);
      return params.toString();
    }

    function loadQueryString(force = false) {
      const params = new URLSearchParams({ max: maxRecords.value || '1000' });
      if (startDate.value) params.set('start', startDate.value);
      if (endDate.value) params.set('end', endDate.value);
      if (force) params.set('refresh', '1');
      return params.toString();
    }

    async function load(force = false) {
      statusEl.textContent = '正在采集历史通信记录...';
      exportCSV.disabled = true;
      meta.innerHTML = '';
      table.innerHTML = '<div class="empty">正在采集 Sysmon、安全日志、防火墙日志、DNS Client 日志和 DNS 缓存...</div>';
      const [historyData, liveData, monitorData] = await Promise.allSettled([
        loadJSON(`/api/network/history?${loadQueryString(force)}`),
        loadJSON(`/api/network/live${force ? '?refresh=1' : ''}`),
        loadJSON('/api/network/monitor')
      ]);
      if (historyData.status !== 'fulfilled') {
        throw historyData.reason;
      }
      const data = historyData.value;
      records = data.records || [];
      collectionErrors = data.collectionErrors || [];
      if (liveData.status === 'fulfilled') {
        liveRecords = liveData.value.items || [];
        liveGeneratedAt = liveData.value.generatedAt || '';
      } else {
        liveRecords = [];
        liveGeneratedAt = '';
        collectionErrors = [...collectionErrors, `当前快照: ${liveData.reason.message}`];
      }
      if (monitorData.status === 'fulfilled') {
        monitorInfo = monitorData.value || {};
        monitorRecords = monitorInfo.items || [];
      } else {
        monitorInfo = {};
        monitorRecords = [];
        collectionErrors = [...collectionErrors, `短连接监测: ${monitorData.reason.message}`];
      }
      exportCSV.disabled = false;
      statusEl.textContent = `生成时间 ${data.generatedAt || ''}，记录 ${records.length}`;
      render();
    }

    document.getElementById('refresh').addEventListener('click', () => {
      load(true).catch(err => {
        table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
        statusEl.textContent = '加载失败';
      });
    });

    exportCSV.addEventListener('click', () => {
      statusEl.textContent = '正在生成 CSV...';
      if (activeTab === 'all') {
        exportAllCSV();
        statusEl.textContent = `全部证据已导出 ${visibleItems().length} 条`;
        return;
      }
      if (activeTab === 'live') {
        const qs = queryString();
        downloadCSV(`/api/network/live.csv${qs ? '?' + qs : ''}`);
      } else if (activeTab === 'monitor') {
        const qs = queryString();
        downloadCSV(`/api/network/monitor.csv${qs ? '?' + qs : ''}`);
      } else {
        downloadCSV(`/api/network/history.csv?${queryString()}`);
      }
    });

    document.querySelectorAll('button.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        render();
      });
    });

    filter.addEventListener('input', render);
    startDate.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    endDate.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));
    maxRecords.addEventListener('change', () => load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    }));

    function applyInitialQuery() {
      const params = new URLSearchParams(window.location.search);
      const category = params.get('category');
      if (category && ['connections', 'dns', 'live', 'monitor', 'all'].includes(category)) {
        activeTab = category;
      }
      const q = params.get('q');
      if (q) {
        filter.value = q;
      }
      if (params.get('start')) startDate.value = params.get('start');
      if (params.get('end')) endDate.value = params.get('end');
      if (params.get('max')) maxRecords.value = params.get('max');
    }

    async function refreshMonitor() {
      try {
        const data = await loadJSON('/api/network/monitor?watch=1');
        monitorInfo = data || {};
        monitorRecords = monitorInfo.items || [];
        if (activeTab === 'monitor' || activeTab === 'all') render();
        else updateTabs();
      } catch (err) {
        monitorInfo = { ...monitorInfo, lastError: err.message || String(err) };
        if (activeTab === 'monitor' || activeTab === 'all') render();
      }
    }

    applyInitialQuery();
    load().catch(err => {
      table.innerHTML = `<div class="empty bad">${escapeCell(err.message)}</div>`;
      statusEl.textContent = '加载失败';
    });
    monitorTimer = setInterval(refreshMonitor, 2000);
    window.addEventListener('beforeunload', () => clearInterval(monitorTimer), { once: true });
  </script>
</body>
</html>
